function saveBook(id){
  const title = fv('f_bktitle');
  if(!title){ toast('Kitap adı gerekli'); return; }
  const pages = parseInt(fv('f_bkpages')), cur = parseInt(fv('f_bkcur'));
  const data = {title, author:fv('f_bkauthor'), pages:isNaN(pages)?null:pages,
    current:isNaN(cur)?0:cur, status:fv('f_bkstatus'), note:fv('f_bknote')};
  if(data.pages && data.current > data.pages) data.current = data.pages;
  if(data.pages && data.current >= data.pages) data.status = 'bitti';
  if(data.status==='bitti') data.finished = today();
  if(id){ Object.assign(state.books.find(x=>x.id===id), data); toast('Kitap güncellendi'); }
  else { state.books.push({id:uid(), ...data}); toast('Okuma listesine eklendi'); }
  save(); closeModal(); render();
}

/* Genel Bakış üst uyarısı: geciken, bugünkü ve yarınki açık hatırlatmalar. Öğrenci Modunda hiç oluşturulmaz. */
function dashboardReminderAlert(){
  if(studentMode) return '';
  const t = today();
  const tm = new Date(); tm.setDate(tm.getDate()+1);
  const tomorrow = localDate(tm);
  const list = state.reminders.filter(r=>!r.done && r.date && r.date<=tomorrow)
    .sort((a,b)=>a.date.localeCompare(b.date) || (a.time||'').localeCompare(b.time||''));
  if(!list.length) return '';
  const urgent = list.some(r=>r.date<=t);
  const nToday = list.filter(r=>r.date===t).length, nLate = list.filter(r=>r.date<t).length, nTom = list.length-nToday-nLate;
  const parts = [];
  if(nLate) parts.push(`${nLate} gecikmiş`); if(nToday) parts.push(`${nToday} bugün`); if(nTom) parts.push(`${nTom} yarın`);
  const rows = list.map(r=>{
    const k = r.date<t ? 'late' : r.date===t ? 'today' : 'tomorrow';
    const lbl = k==='late' ? 'Gecikti · '+fmtDate(r.date) : k==='today' ? 'Bugün' : 'Yarın';
    return `<div class="rem-alert-row">
      <span class="when ${k}">${lbl}${r.time?' '+r.time:''}</span>
      <span class="t">${esc(r.title)}${r.note?`<span class="m" style="display:block;font-weight:500">${esc(r.note)}</span>`:''}</span>
      <button class="pay-btn pay-no" onclick="toggleReminderDone('${r.id}')">Tamamla</button>
    </div>`;}).join('');
  return `
  <div class="rem-alert ${urgent?'urgent':''}" role="alert">
    <h3>🔔 Hatırlatma uyarısı <span style="font-weight:600;opacity:.8">· ${parts.join(', ')}</span>
      <button class="btn btn-ghost btn-sm" style="margin-left:auto" onclick="go('notes')">Tümü →</button></h3>
    <div class="rem-alert-list">${rows}</div>
  </div>`;
}
function reminderChip(r){
  return `<button class="bill-chip ${r.done?'paid':'rem'}" onclick="toggleReminderDone('${r.id}')"
    title="${esc(r.title)} — ${r.done?'işareti kaldırmak':'tamamlandı işaretlemek'} için tıkla">🔔 ${r.time?r.time+' ':''}${esc(r.title)}${r.done?' ✓':''}</button>`;
}
function reminderWhen(r){
  if(!r.date) return 'Tarihsiz';
  const t = today();
  const base = r.date===t ? 'Bugün' : fmtDate(r.date);
  return base + (r.time ? ' · '+r.time : '');
}
function viewNotes(){
  const t = today();
  const rems = [...state.reminders].sort((a,b)=>{
    if(a.done!==b.done) return a.done?1:-1;
    return (a.date||'9999').localeCompare(b.date||'9999') || (a.time||'').localeCompare(b.time||'');
  });
  const open = state.reminders.filter(r=>!r.done).length;
  const remList = !rems.length
    ? emptyState('🔔','Hatırlatma yok','Kendine hatırlatmalar ekle; tarihli olanlar Takvim şeridinde ve Genel Bakış\'ta görünür.')
    : rems.map(r=>{
      const late = !r.done && r.date && r.date < t;
      return `<div class="rem-item ${r.done?'done':''} ${late?'late':''}">

    : `<div class="memo-grid">${memos.map(m=>`
      <div class="memo ${m.pinned?'pinned':''}" ondblclick="openMemoForm('${m.id}')" title="Düzenlemek için çift tıkla">
        <h4>${m.pinned?'📌 ':''}${esc(m.title||'Not')}</h4>

          <span>${m.updatedAt?new Date(m.updatedAt).toLocaleDateString('tr-TR',{day:'numeric',month:'short'}):''}</span>

            <button class="icon-btn" onclick="toggleMemoPin('${m.id}')" title="${m.pinned?'Sabitlemeyi kaldır':'Sabitle'}">📌</button>
            <button class="icon-btn" onclick="openMemoForm('${m.id}')" title="Düzenle">${SVG_EDIT}</button>
            <button class="icon-btn danger" onclick="delItem('memos','${m.id}')" title="Sil">${SVG_DEL}</button>
          </span>
        </div>
      </div>`).join('')}</div>`;
  return `
  <div class="topbar">
    <div><h1>Hatırlatma & Notlar</h1><div class="sub">${open} açık hatırlatma · ${state.memos.length} not</div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-ghost" onclick="openMemoForm()">＋ Not</button>
      <button class="btn btn-primary" onclick="openReminderForm()">＋ Hatırlatma</button>
    </div>
  </div>
  <div class="card panel"><h3>🔔 Hatırlatmalar</h3>${remList}</div>
  <div class="card panel"><h3>📝 Notlarım</h3>${memoGrid}</div>
  <p style="color:var(--muted);font-size:.8rem;margin-top:12px">Bu bölüm Öğrenci Modu açıkken görünmez. Veriler yalnızca bu cihazda tutulur, buluta gönderilmez.</p>`;
}

const CLOUD_KEY = 'ogrenciTakipBulut';

function loadCloud(){
  let c = {};
  try{ c = JSON.parse(localStorage.getItem(CLOUD_KEY)) || {}; }catch(e){}
  c.synced = c.synced || {};
  // Eski GitHub yayın ayarlarından site adresini devral, token'ı sil
  try{

    if(old){
      if(!c.site) c.site = old.site || (old.user && old.repo ? `https://${old.user}.github.io/${old.repo}` : '');
      localStorage.removeItem('ogrenciTakipYayin');

function saveCloud(){ localStorage.setItem(CLOUD_KEY, JSON.stringify(cloud)); }
function cloudConfig(){ return cloud.config || FB_DEFAULT_CONFIG; }
function siteUrl(){ return (cloud.site||'').trim().replace(/\/+$/,''); }
function genCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const a = crypto.getRandomValues(new Uint8Array(6));
  return Array.from(a, b => chars[b % chars.length]).join('');
}
function studentCode(s){ if(!s.code){ s.code = genCode(); save(); } return s.code; }
function studentLink(s){ return siteUrl() ? `${siteUrl()}/ogrenci.html?o=${s.id}` : ''; }

/* --- Şifreleme (WebCrypto: PBKDF2 + AES-GCM) --- */
const _te = new TextEncoder();
function bufToB64(buf){
  const u = new Uint8Array(buf); let s = '';
  for(let i=0;i<u.length;i+=0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i+0x8000));
  return btoa(s);
}
const _keyCache = {};
async function deriveKey(code, salt){
  const ck = code.trim().toUpperCase() + '|' + salt;
  if(_keyCache[ck]) return _keyCache[ck];
  const base = await crypto.subtle.importKey('raw', _te.encode(code.trim().toUpperCase()), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:_te.encode(salt), iterations:120000, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
  _keyCache[ck] = key; return key;
}
async function encryptPayload(obj, code, salt){
  const key = await deriveKey(code, salt);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, _te.encode(JSON.stringify(obj)));
  return {v:1, iv:bufToB64(iv), data:bufToB64(ct)};
}
async function sha256hex(str){
  const h = await crypto.subtle.digest('SHA-256', _te.encode(str));
  return Array.from(new Uint8Array(h), b=>b.toString(16).padStart(2,'0')).join('');
}
/* Öğrencinin tik belgesi: yol yalnızca kodu bilenin hesaplayabileceği bir özet */
async function tickId(s){ return sha256hex(`tick:${s.id}:${studentCode(s).trim().toUpperCase()}`); }

/* Öğrenciye gösterilecek veri: ücret, telefon, öğretmen notu dahil edilmez; ders notları depodan okunur, buraya girmez */
function studentPayload(s){
  return {
    v:2,
    student:{name:s.name, grade:s.grade||''},
    lessons: state.lessons.filter(l=>l.sid===s.id).map(l=>({date:l.date, start:l.start, hours:l.hours, subject:l.subject, topic:l.topic||'', status:l.status||''})),
    homeworks: state.homeworks.filter(h=>h.sid===s.id).map(h=>({id:h.id, subject:h.subject, desc:h.desc, due:h.due, status:h.status, updatedAt:h.updatedAt||0})),
    exams: state.exams.filter(e=>e.sid===s.id).map(e=>({date:e.date, name:e.name||'', note:e.note||'', kind:e.kind, type:e.type, bransSubject:e.bransSubject, net:e.net, sure:e.sure, nets:e.nets, srcId:e.srcId||null, byStudent:!!e.byStudent})),
  };
}

/* --- Firebase bağlantısı --- */
const fb = {db:null, auth:null, user:null, error:'', status:'off'}; // off | signedout | syncing | ok | error
function cloudAvailable(){ return typeof firebase !== 'undefined' && !!cloudConfig().projectId; }
function cloudInit(){
  if(!cloudAvailable()){ fb.status = 'off'; fb.error = 'Firebase kütüphanesi yüklenemedi (internet?)'; updateCloudBadge(); return; }
  try{
    if(!firebase.apps.length) firebase.initializeApp(cloudConfig());
    fb.db = firebase.firestore();
    fb.auth = firebase.auth();
    fb.auth.onAuthStateChanged(u => {
      fb.user = u;
      fb.status = u ? 'ok' : 'signedout';
      updateCloudBadge();
      if(u){ watchPanel(); scheduleSync(true); watchTicks(); }
      else { stopTicks(); stopPanel(); }
    });
  }catch(e){ fb.status = 'error'; fb.error = e.message; updateCloudBadge(); }
}
async function cloudSignIn(email, pass){
  if(!fb.auth) cloudInit();
  if(!fb.auth) throw new Error(fb.error || 'Firebase hazır değil');
  await fb.auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});
  await fb.auth.signInWithEmailAndPassword(email, pass);
}
function cloudSignOut(){ if(fb.auth) fb.auth.signOut(); }
function cloudErrText(e){
  const c = (e && e.code) || '';
  if(c.includes('invalid-credential') || c.includes('wrong-password') || c.includes('user-not-found')) return 'E-posta ya da şifre hatalı (Firebase → Authentication → Users içinde bu kullanıcı olmalı)';
  if(c.includes('operation-not-allowed')) return 'Firebase → Authentication → Sign-in method → Email/Password açık değil';
  if(c.includes('permission-denied')) return 'Firestore kuralları yazmaya izin vermiyor — Bulut penceresinden kuralları kopyalayıp Firestore → Rules\'a yapıştır';
  if(c.includes('network')) return 'İnternet bağlantısı yok';
  return (e && (e.message || String(e))) || 'Bilinmeyen hata';
}

/* --- Otomatik senkron: her save() sonrası değişen öğrenciler yazılır --- */
let _syncTimer = null, _syncing = false, _syncAgain = false;
function scheduleSync(now){
  if(!fb.user) return;
  clearTimeout(_syncTimer);
  _syncTimer = setTimeout(syncNow, now ? 150 : 1200);
}
async function syncNow(){
  if(!fb.user || !fb.db) return;
  if(_syncing){ _syncAgain = true; return; }
  _syncing = true; fb.status = 'syncing'; updateCloudBadge();
  try{
    for(const s of state.students){
      const body = studentPayload(s);
      const h = await sha256hex(JSON.stringify(body) + '|' + studentCode(s));
      if(cloud.synced[s.id] === h) continue;
      const pkg = await encryptPayload({...body, publishedAt:new Date().toISOString()}, studentCode(s), s.id);
      await fb.db.collection('pages').doc(s.id).set({...pkg, updatedAt: Date.now()});
      cloud.synced[s.id] = h; saveCloud();
    }
    // Silinen öğrencilerin belgelerini kaldır
    for(const id of Object.keys(cloud.synced)){
      if(state.students.some(s=>s.id===id)) continue;
      try{ await fb.db.collection('pages').doc(id).delete(); }catch(e){}
      delete cloud.synced[id]; saveCloud();
    }
    await pushPanel();
    cloud.lastSync = Date.now(); saveCloud();
    fb.status = 'ok'; fb.error = '';
  }catch(e){
    fb.status = 'error'; fb.error = cloudErrText(e);
  }finally{
    _syncing = false; updateCloudBadge();
    if(_syncAgain){ _syncAgain = false; scheduleSync(); }
  }
}
/* Yeniden tam gönderim (ör. kurallar düzeltildikten sonra) */
function resyncAll(){ cloud.synced = {}; saveCloud(); scheduleSync(true); toast('Tüm öğrenciler yeniden gönderiliyor'); }

/* --- Öğrenci tiklerini canlı dinle --- */
const _tickUnsubs = {};
/* ---------- PANEL SENKRONU: tüm panel verisi panel/<uid> belgesinde, yalnızca öğretmen hesabı okur/yazar.
   Telefon ve bilgisayar aynı hesapla girince aynı veriyi görür; son kaydeden kazanır. ---------- */
let _panelUnsub = null, _panelSeen = false, _panelRemoteCount = 0, _panelRemoteAt = 0;
function panelRef(){ return fb.db.collection('panel').doc(fb.user.uid); }
async function pushPanel(force){
  if(!fb.user || !fb.db) return;
  if(!force){
    if(!_panelSeen) return;                                // uzak kopyayı görmeden yazma
    if(!_panelAt || _panelAt <= (cloud.panelPushed||0)) return;
    if(!stateCount() && _panelRemoteCount > 0) return;      // boş cihaz, dolu bulut kopyasını ezmesin
  }
  const data = JSON.stringify(state);
  if(data.length > 950000){ fb.error = 'Panel verisi bulut sınırını aştı (1 MB)'; return; }
  const at = force ? (_panelAt = Date.now()) : _panelAt;
  if(force) localStorage.setItem(PANEL_AT_KEY, String(at));
  await panelRef().set({data, updatedAt: at, device: navigator.userAgent.slice(0,60)});
  cloud.panelPushed = at; saveCloud();
}
function watchPanel(){
  stopPanel();
  if(!fb.user || !fb.db) return;
  _panelSeen = false;
  _panelUnsub = panelRef().onSnapshot(doc=>{
    _panelSeen = true;
    const r = doc.exists ? doc.data() : null;
    if(!r || !r.data){ _panelRemoteCount = 0; _panelRemoteAt = 0; scheduleSync(true); return; } // bulutta panel yok: yerel veriyi gönder
    _panelRemoteAt = r.updatedAt || 0;
    try{ _panelRemoteCount = stateCount(JSON.parse(r.data)); }catch(e){ _panelRemoteCount = 0; }
    if(r.updatedAt > _panelAt){
      try{
        const d = JSON.parse(r.data);
        if(!d || !Array.isArray(d.students)) return;
        const modal = document.getElementById('modalBackdrop');
        if(modal && modal.classList.contains('open')) return; // form açıkken ezme; sonraki değişiklikte gelir
        localStorage.setItem(KEY, r.data);
        state = load();
        _panelAt = r.updatedAt; localStorage.setItem(PANEL_AT_KEY, String(_panelAt));
        cloud.panelPushed = r.updatedAt; saveCloud();
        render(); toast('Panel verisi buluttan güncellendi');
      }catch(e){}
    } else if(_panelAt > r.updatedAt){ scheduleSync(true); }  // yerel daha yeni: gönder
    else if(cloud.panelPushed !== r.updatedAt){ cloud.panelPushed = r.updatedAt; saveCloud(); }
  }, err=>{ fb.error = 'Panel senkronu: ' + err.message; fb.status='error'; updateCloudBadge(); });
}
function stopPanel(){ if(_panelUnsub){ _panelUnsub(); _panelUnsub = null; } _panelSeen = false; }
/* Elle: buluttaki paneli bu cihaza indir */
async function pullPanelNow(){
  if(!fb.user || !fb.db){ toast('Önce Bulut penceresinden giriş yap'); return; }
  try{
    const doc = await panelRef().get();
    const r = doc.exists ? doc.data() : null;
    if(!r || !r.data){ toast('Bulutta panel verisi yok — diğer cihazdan "Paneli Buluta Gönder" de'); return; }
    const d = JSON.parse(r.data);
    if(!d || !Array.isArray(d.students)) throw 0;
    if(stateCount() && !confirm(`Bu cihazdaki ${stateCount()} kayıt, buluttaki ${stateCount(d)} kayıtla değiştirilecek. Devam edilsin mi?`)) return;
    localStorage.setItem(KEY, r.data);
    state = load();
    _panelAt = r.updatedAt || Date.now(); localStorage.setItem(PANEL_AT_KEY, String(_panelAt));
    cloud.panelPushed = _panelAt; saveCloud();
    closeModal(); go('dashboard'); toast(`Buluttan indirildi · ${stateCount()} kayıt`);
  }catch(e){ toast('İndirilemedi: ' + (e.message||'veri okunamadı')); }
}
/* Elle: bu cihazdaki paneli buluta gönder */
async function pushPanelNow(){
  if(!fb.user || !fb.db){ toast('Önce Bulut penceresinden giriş yap'); return; }
  if(!stateCount()){ toast('Bu cihazda kayıt yok — gönderilecek bir şey yok'); return; }
  if(_panelRemoteCount && !confirm(`Buluttaki ${_panelRemoteCount} kayıt, bu cihazdaki ${stateCount()} kayıtla değiştirilecek. Devam edilsin mi?`)) return;
  try{
    await pushPanel(true);
    toast(`Buluta gönderildi · ${stateCount()} kayıt`);
    const st = document.getElementById('cloudStatus'); if(st) st.innerHTML = cloudStatusText();
  }catch(e){ toast('Gönderilemedi: ' + (e.message||'')); }
}

async function watchTicks(){
  if(!fb.user || !fb.db) return;
  for(const s of state.students){
    if(_tickUnsubs[s.id]) continue;
    _tickUnsubs[s.id] = () => {}; // aynı anda iki kez abone olmayı önle
    const tid = await tickId(s);
    _tickUnsubs[s.id] = fb.db.collection('ticks').doc(tid).onSnapshot(
      snap => applyTicks(s.id, snap.exists ? snap.data() : null),
      err => { /* izin hatası vb. — sessiz geç */ });
  }
  for(const id of Object.keys(_tickUnsubs)){
    if(!state.students.some(s=>s.id===id)){ _tickUnsubs[id](); delete _tickUnsubs[id]; }
  }
}
function stopTicks(){ for(const id of Object.keys(_tickUnsubs)){ _tickUnsubs[id](); delete _tickUnsubs[id]; } }
function applyTicks(sid, data){
  if(!data) return;
  let changed = 0, msg = '';
  const s = student(sid); const first = s ? s.name.split(' ')[0] : 'Öğrenci';
  // 0) Son giriş: öğrenci sayfası açılınca seenAt yazar (eski kurallarda yalnızca updatedAt güncellenir)
  const seen = +data.seenAt || +data.updatedAt || 0;
  if(s && seen > (+s.lastSeen||0)){ s.lastSeen = seen; changed++; }
  // 1) Ödev tikleri
  for(const [hwId, t] of Object.entries(data.hw||{})){
    const h = state.homeworks.find(x=>x.id===hwId && x.sid===sid);
    if(!h || !t || !t.status) continue;
    if((+t.at||0) > (+h.updatedAt||0) && h.status !== t.status){
      h.status = t.status; h.updatedAt = +t.at; h.byStudent = true; changed++;
      msg = `${first} ödev durumunu güncelledi: ${h.desc}`;
    }
  }
  // 2) Öğrencinin girdiği denemeler (kaynak: öğrenci; öğretmen düzenlerse öğretmen kazanır)
  const ex = data.exams || {};
  for(const [srcId, e] of Object.entries(ex)){
    if(!e || !e.date) continue;
    const clean = sanitizeStudentExam(e); if(!clean) continue;
    let cur = state.exams.find(x=>x.srcId===srcId && x.sid===sid);
    if(!cur){ state.exams.push({id:uid(), sid, srcId, byStudent:true, updatedAt:+e.at||0, ...clean}); changed++; msg = `${first} deneme sonucu girdi: ${clean.name || clean.type}`; }
    else if((+e.at||0) > (+cur.updatedAt||0)){ Object.assign(cur, clean, {updatedAt:+e.at, byStudent:true}); changed++; msg = `${first} bir deneme sonucunu düzenledi`; }
  }
  const before = state.exams.length;
  state.exams = state.exams.filter(x=>!(x.sid===sid && x.srcId && !ex[x.srcId]));
  if(state.exams.length !== before) changed++;
  // 3) Çalışma kayıtları
  const st = data.studies || {};
  state.studies = state.studies || [];
  for(const [id, x] of Object.entries(st)){
    if(!x || !x.date || !x.subject) continue;
    const clean = {date:String(x.date).slice(0,10), subject:String(x.subject).slice(0,40), hours:Math.max(0, Math.min(24, +x.hours||0)), topic:String(x.topic||'').slice(0,600), at:+x.at||0};
    let cur = state.studies.find(y=>y.id===id);
    if(!cur){ state.studies.push({id, sid, ...clean}); changed++; msg = `${first} çalışma kaydı ekledi: ${clean.subject}`; }
    else if(clean.at > (+cur.at||0)){ Object.assign(cur, clean); changed++; }
  }
  const b2 = state.studies.length;
  state.studies = state.studies.filter(y=>!(y.sid===sid && !st[y.id]));
  if(state.studies.length !== b2) changed++;

  if(changed){ save(); render(); if(msg) toast(msg); }
}
function sanitizeStudentExam(e){
  const num = v => { const n = parseFloat(v); return isNaN(n) ? null : Math.round(n*100)/100; };
  const base = {date:String(e.date).slice(0,10), name:String(e.name||'').slice(0,80), note:String(e.note||'').slice(0,300)};
  if(e.kind==='brans'){
    const net = num(e.net); if(net==null || net<0 || net>BRANS_MAX) return null;
    return {...base, kind:'brans', type:'Branş', bransSubject:String(e.bransSubject||'Matematik').slice(0,20), net, sure:num(e.sure), nets:null};
  }
  const type = GENEL_NETS[e.type] ? e.type : 'TYT';
  const nets = {}; let tot = 0, any = false;
  for(const [sub, max] of GENEL_NETS[type]){
    const v = e.nets && num(e.nets[sub]); if(v==null) continue;
    if(v<0 || v>max) return null;
    nets[sub] = v; tot += v; any = true;
  }
  if(!any) return null;
  return {...base, kind:'genel', type, nets, net:Math.round(tot*100)/100, sure:null, bransSubject:null};
}
/* Öğretmen bir öğrenci girdisini silince öğrencinin bulut belgesinden de kaldır */
async function removeStudentInput(sid, field, id){
  try{
    const s = student(sid); if(!s || !fb.db) return;
    const tid = await tickId(s);
    await fb.db.collection('ticks').doc(tid).update({[`${field}.${id}`]: firebase.firestore.FieldValue.delete(), updatedAt: Date.now()});
  }catch(e){}
}

/* --- Sidebar rozeti --- */
function updateCloudBadge(){
  const l = document.getElementById('cloudLabel'), b = document.getElementById('cloudBtn');
  if(!l) return;
  const txt = {off:'Bulut: kapalı', signedout:'Bulut: giriş yap', syncing:'Bulut: gönderiliyor…', ok:'Bulut: senkron ✓', error:'Bulut: hata'}[fb.status] || 'Bulut';
  l.textContent = txt;
  b.classList.toggle('cloud-ok', fb.status==='ok');
  b.classList.toggle('cloud-err', fb.status==='error' || fb.status==='signedout');
  b.title = fb.error || txt;
}

/* --- Firestore güvenlik kuralları (e-posta doldurulmuş) --- */
function rulesText(email){
  return `rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    function isTeacher() {
      return request.auth != null && request.auth.token.email == "${email}";
    }
    // Şifreli öğrenci sayfaları: adresi bilen okur, yalnızca öğretmen yazar
    match /pages/{sid} {
      allow get: if true;
      allow list: if false;
      allow write: if isTeacher();
    }
    // Öğrenci tikleri: gizli adresi (kodu) bilen okur/yazar
    match /ticks/{tid} {
      allow get: if true;
      allow list: if false;
      allow create, update: if request.resource.data.keys().hasOnly(['hw', 'exams', 'studies', 'seenAt', 'updatedAt'])
        && (!('seenAt' in request.resource.data) || request.resource.data.seenAt is number)
        && (!('hw' in request.resource.data) || (request.resource.data.hw is map && request.resource.data.hw.size() <= 500))
        && (!('exams' in request.resource.data) || (request.resource.data.exams is map && request.resource.data.exams.size() <= 300))
        && (!('studies' in request.resource.data) || (request.resource.data.studies is map && request.resource.data.studies.size() <= 2000));
      allow delete: if isTeacher();
    }
    // Panel verisi (öğrenciler, dersler, ücretler, kişisel notlar): yalnızca öğretmen hesabı, kendi belgesi
    match /panel/{uid} {
      allow read, write: if isTeacher() && request.auth.uid == uid;
    }
    match /{document=**} {
      allow read, write: if false;
    }
  }
}`;
}

function cloudStatusText(){
  const n = Object.keys(cloud.synced).length;
  let s = fb.user ? `Giriş: <b>${esc(fb.user.email)}</b><br>` : 'Giriş yapılmadı. E-posta ve şifreyle bağlan.<br>';
  if(cloud.lastSync) s += `Son senkron: ${new Date(cloud.lastSync).toLocaleString('tr-TR')} · ${n} öğrenci bulutta<br>`;
  if(fb.user) s += `Panel: bu cihazda <b>${stateCount()}</b> kayıt · bulutta <b>${_panelSeen ? _panelRemoteCount : '?'}</b> kayıt${_panelRemoteAt>1?' ('+new Date(_panelRemoteAt).toLocaleString('tr-TR')+')':''}<br>`;
  if(fb.error) s += `<span style="color:var(--red)">${esc(fb.error)}</span>`;

function parseConfigBlock(txt){
  const out = {}; const re = /(apiKey|authDomain|projectId|storageBucket|messagingSenderId|appId)\s*[:=]\s*["']([^"']+)["']/g;
  let m; while((m = re.exec(txt))) out[m[1]] = m[2];
  return (out.apiKey && out.projectId && out.appId) ? out : null;
}
async function saveCloudForm(){
  const cfgTxt = fv('c_cfg');
  if(cfgTxt){
    const c = parseConfigBlock(cfgTxt);
    if(!c){ toast('Ayar bloğu okunamadı: apiKey, projectId ve appId olmalı'); return; }
    if(c.projectId !== cloudConfig().projectId){ cloud.config = c; cloud.synced = {}; saveCloud(); toast('Yeni proje kaydedildi — sayfayı yenile'); return; }
    cloud.config = c;
  }
  cloud.site = fv('c_site'); saveCloud();
  if(fb.user){ closeModal(); toast('Kaydedildi'); return; }
  const email = fv('c_email'), pass = fv('c_pass');
  if(!email || !pass){ toast('E-posta ve şifre gerekli'); return; }
  cloud.email = email; saveCloud();
  const st = document.getElementById('cloudStatus'); if(st) st.innerHTML = 'Bağlanılıyor…';
  try{
    await cloudSignIn(email, pass);
    closeModal(); toast('Buluta bağlanıldı — veriler gönderiliyor');
  }catch(e){
    fb.error = cloudErrText(e); fb.status = 'error'; updateCloudBadge();
    if(st) st.innerHTML = cloudStatusText();
  }
}
function copyRules(){
  const email = fv('c_email') || cloud.email || (fb.user && fb.user.email) || 'SENIN@EPOSTAN.com';
  copyText(rulesText(email));
}

/* --- Öğrenciyle paylaşım --- */
function openShareForm(id){
  const s = student(id); if(!s) return;
  const code = studentCode(s);
  const link = studentLink(s);
  const msg = `Merhaba ${s.name.split(' ')[0]}, ödevlerini, ders notlarını, deneme sonuçlarını ve ders programını buradan görebilirsin:\n${link}\nErişim kodun: ${code}`;
  openModal(`
  <h3>${esc(s.name)} · Öğrenci Sayfası</h3>
  ${link ? `<div class="share-box"><div class="lbl">Bağlantı</div><div class="val">${esc(link)}</div>
    <div class="share-row">
      <button class="btn btn-ghost btn-sm" onclick="copyText(${JSON.stringify(link)})">Kopyala</button>
      <a class="btn btn-ghost btn-sm" href="${esc(link)}" target="_blank" rel="noopener">Aç</a>
    </div></div>`
  : `<div class="share-box"><div class="lbl">Bağlantı</div><div class="hint-text">Önce "Bulut" penceresinde öğrenci sayfası adresini gir; bağlantı otomatik oluşur.</div></div>`}
  <div class="share-box"><div class="lbl">Erişim Kodu</div><div class="val code">${esc(code)}</div>
    <div class="share-row">
      <button class="btn btn-ghost btn-sm" onclick="copyText('${esc(code)}')">Kopyala</button>
      <button class="btn btn-ghost btn-sm" onclick="regenCode('${s.id}')">Yeni Kod Üret</button>
    </div>
    <div class="hint-text">Kod değişirse öğrencinin sayfası yeni kodla açılır; eski kod çalışmaz.</div>
  </div>
  <div class="share-row">
    <button class="btn btn-ghost btn-sm" onclick="copyText(${JSON.stringify(msg)})">Mesajı Kopyala</button>
    <a class="btn btn-ghost btn-sm" href="https://wa.me/${esc((s.phone||'').replace(/\D/g,'').replace(/^0/,'90'))}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">WhatsApp ile Gönder</a>
  </div>
  <div class="pub-status">${fb.user ? 'Bulut bağlı: değişiklikler otomatik gönderilir.' : '<span style="color:var(--red)">Bulut bağlı değil — öğrenci güncel veriyi göremez. Sol menüden "Bulut"a tıkla.</span>'}</div>
  <div class="modal-actions">
    <button class="btn btn-ghost" onclick="closeModal()">Kapat</button>
  </div>`);
}
function regenCode(id){
  const s = student(id); if(!s) return;
  if(!confirm('Yeni kod üretilsin mi? Eski kod artık çalışmaz; öğrenciye yeni kodu göndermelisin.')) return;
  // Eski tik belgesini bırak; yeni kodla yeni belge oluşur
  if(_tickUnsubs[id]){ _tickUnsubs[id](); delete _tickUnsubs[id]; }
  s.code = genCode(); save(); watchTicks(); openShareForm(id); toast('Yeni kod üretildi');
}
function copyText(t){
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(
    ()=>toast('Kopyalandı'),
    ()=>{ prompt('Kopyala:', t); });
}

/* ================= TEMA ================= */
const THEME_KEY = 'ogrenciTakipTema';
function applyTheme(t){
  document.body.classList.toggle('dark', t==='dark');
  const lbl = document.getElementById('themeLabel');
  if(lbl) lbl.textContent = t==='dark' ? 'Açık Tema' : 'Koyu Tema';
}
function toggleTheme(){
  const t = document.body.classList.contains('dark') ? 'light' : 'dark';
  localStorage.setItem(THEME_KEY, t);
  applyTheme(t);
}

/* ================= BAŞLAT ================= */
applyTheme(localStorage.getItem(THEME_KEY) || 'light');
studentMode = localStorage.getItem(SM_KEY) === '1';
applyStudentMode();
render();
cloudInit();
</script>
