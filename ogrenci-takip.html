<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Öğrenci Takip Sistemi</title>
<style>
:root{
  --bg:#f4f3ef; --bg2:#edeff9; --card:#ffffff; --ink:#20222e; --muted:#6d7089; --line:#e8e7f0; --line-strong:#c9cdea;
  --accent:#4f46e5; --accent2:#9333ea; --accent-soft:#edebfd;
  --green:#0f9d6e; --green-soft:#e3f6ee; --red:#e5484d; --red-soft:#fdebec;
  --amber:#b45309; --amber-soft:#fdf1e0; --blue:#2563eb; --blue-soft:#e7eefe;
  --cyan:#0e7490; --cyan-soft:#e0f4f8; --violet:#7c3aed; --violet-soft:#f1eafd;
  --rose:#be185d; --rose-soft:#fce7f1;
  --row-hover:#f7f8fd; --field-bg:#fafbfe;
  --sb-bg:#171830; --sb-text:#c6c9e8; --sb-strong:#ffffff; --sb-muted:#9498c4;
  --sb-hover:rgba(255,255,255,.07); --sb-line:rgba(255,255,255,.09);
  --hero1:#232447; --hero2:#3b3b8f; --hero3:#6d4bc4;
  --toast-bg:#191b2e; --toast-ink:#ffffff;
  --glow:rgba(79,70,229,.5);
  --shadow:0 1px 2px rgba(30,33,56,.05),0 8px 24px -12px rgba(30,33,56,.12);
  --shadow-lg:0 24px 60px -24px rgba(30,33,56,.28);
  --radius:18px;
  font-size:15px;
}
body.dark{
  --bg:#16151b; --bg2:#0f0e13; --card:#1e1d25; --ink:#eceaf2; --muted:#9c9dae; --line:#2c2b37; --line-strong:#403e4f;
  --accent:#f97316; --accent2:#fb923c; --accent-soft:#2f2119;
  --green:#34d399; --green-soft:#142b21; --red:#f87171; --red-soft:#33191c;
  --amber:#fbbf24; --amber-soft:#2f2712; --blue:#60a5fa; --blue-soft:#182437;
  --cyan:#22d3ee; --cyan-soft:#11303a; --violet:#a78bfa; --violet-soft:#261e3b;
  --rose:#fb7185; --rose-soft:#341a24;
  --row-hover:#24232d; --field-bg:#17161d;
  --sb-bg:#1b140c; --sb-text:#d8cfc3; --sb-strong:#ffffff; --sb-muted:#a3947f;
  --sb-hover:rgba(255,255,255,.06); --sb-line:rgba(255,255,255,.09);
  --hero1:#211405; --hero2:#7c2d12; --hero3:#cc5803;
  --toast-bg:#f5f1ea; --toast-ink:#1d1409;
  --glow:rgba(249,115,22,.45);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px -12px rgba(0,0,0,.55);
  --shadow-lg:0 24px 60px -24px rgba(0,0,0,.75);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  background:linear-gradient(155deg,var(--bg) 0%,var(--bg2) 100%) fixed;
  color:var(--ink); min-height:100vh;
  transition:color .25s;
}
body,.card,.sidebar,.modal{transition:background-color .25s,border-color .25s}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:.95rem}

/* ---------- Layout ---------- */
.app{display:flex;min-height:100vh}
.sidebar{
  width:234px;flex-shrink:0;background:var(--sb-bg);color:var(--sb-text);
  display:flex;flex-direction:column;position:sticky;top:14px;height:calc(100vh - 28px);
  margin:14px 0 14px 14px;border-radius:24px;padding:22px 14px;box-shadow:var(--shadow-lg);
}
.logo{display:flex;align-items:center;gap:10px;padding:2px 10px 22px}
.logo-mark{
  width:38px;height:38px;border-radius:12px;flex-shrink:0;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:grid;place-items:center;color:#fff;font-weight:700;font-size:1.05rem;
  box-shadow:0 6px 16px -6px var(--glow);
}
.logo-text{line-height:1.15}
.logo-text b{color:var(--sb-strong);font-size:1rem;display:block}
.logo-text span{font-size:.72rem;color:var(--sb-muted);letter-spacing:.04em}
.nav{display:flex;flex-direction:column;gap:3px;flex:1}
.nav button{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;
  color:var(--sb-text);font-size:.93rem;font-weight:500;text-align:left;transition:all .15s;width:100%;
}
.nav button svg{width:19px;height:19px;flex-shrink:0;opacity:.85}
.nav button:hover{background:var(--sb-hover);color:var(--sb-strong)}
.nav button.active{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;box-shadow:0 8px 18px -8px var(--glow);
}
.sidebar-foot{display:flex;flex-direction:column;gap:3px;border-top:1px solid var(--sb-line);padding-top:12px}
.sidebar-foot button{
  display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:11px;
  color:var(--sb-muted);font-size:.86rem;transition:all .15s;width:100%;
}
.sidebar-foot button:hover{background:var(--sb-hover);color:var(--sb-strong)}
.sidebar-foot svg{width:17px;height:17px}

.main{flex:1;min-width:0;padding:28px 34px 60px;max-width:1180px;margin:0 auto}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:24px;flex-wrap:wrap}
.topbar h1{font-size:1.45rem;font-weight:700;letter-spacing:-.02em}
.topbar .sub{color:var(--muted);font-size:.86rem;margin-top:3px}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:11px;
  font-size:.9rem;font-weight:600;transition:all .15s;white-space:nowrap;
}
.btn svg{width:16px;height:16px}
.btn-primary{
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;
  box-shadow:0 8px 18px -8px var(--glow);
}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 12px 22px -8px var(--glow)}
.btn-ghost{background:var(--card);border:1px solid var(--line);color:var(--ink);box-shadow:var(--shadow)}
.btn-ghost:hover{border-color:var(--line-strong)}
.btn-danger{background:var(--red-soft);color:var(--red)}
.btn-danger:hover{background:#fbdadc}
.btn-sm{padding:6px 11px;font-size:.82rem;border-radius:9px}
.icon-btn{
  width:30px;height:30px;border-radius:9px;display:inline-grid;place-items:center;
  color:var(--muted);transition:all .15s;
}
.icon-btn:hover{background:var(--accent-soft);color:var(--accent)}
.icon-btn.danger:hover{background:var(--red-soft);color:var(--red)}
.icon-btn svg{width:15px;height:15px}

/* ---------- Cards & stats ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.stat{padding:18px 20px;position:relative;overflow:hidden}
.stat .label{font-size:.78rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stat .value{font-size:1.55rem;font-weight:700;letter-spacing:-.02em;margin-top:7px}
.stat .hint{font-size:.78rem;color:var(--muted);margin-top:4px}
.stat .stat-ico{
  position:absolute;right:14px;top:14px;width:38px;height:38px;border-radius:12px;
  display:grid;place-items:center;
}
.stat .stat-ico svg{width:19px;height:19px}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:900px){.grid-2{grid-template-columns:1fr}}
.panel{padding:20px 22px}
.panel h3{font-size:.98rem;font-weight:700;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.panel h3 .more{font-size:.8rem;color:var(--accent);font-weight:600}

/* ---------- Tables ---------- */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{
  text-align:left;font-size:.73rem;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.06em;padding:12px 14px;border-bottom:1px solid var(--line);
  white-space:nowrap;
}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--row-hover)}
td.num{font-variant-numeric:tabular-nums;font-weight:600}
td .row-note{display:block;font-size:.78rem;color:var(--muted);margin-top:2px}

/* ---------- Chips, badges, avatars ---------- */
.chip{
  display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;
  font-size:.76rem;font-weight:600;white-space:nowrap;
}
.badge-pos{background:var(--green-soft);color:var(--green)}
.badge-neg{background:var(--red-soft);color:var(--red)}
.badge-zero{background:var(--accent-soft);color:var(--accent)}
.avatar{
  width:42px;height:42px;border-radius:13px;display:grid;place-items:center;
  color:#fff;font-weight:700;font-size:.95rem;flex-shrink:0;
}
.avatar.sm{width:30px;height:30px;border-radius:9px;font-size:.72rem}
.student-cell{display:flex;align-items:center;gap:10px;font-weight:600}

/* ---------- Student cards ---------- */
.students-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:16px}
.student-card{padding:20px;cursor:pointer;transition:all .18s;position:relative}
.student-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--line-strong)}
.student-card .head{display:flex;align-items:center;gap:13px;margin-bottom:15px}
.student-card .name{font-weight:700;font-size:1.02rem}
.student-card .grade{font-size:.8rem;color:var(--muted);margin-top:2px}
.student-card .meta{
  display:grid;grid-template-columns:1fr 1fr;gap:9px;font-size:.8rem;color:var(--muted);
  border-top:1px dashed var(--line);padding-top:13px;
}
.student-card .meta b{display:block;color:var(--ink);font-size:.92rem;margin-top:2px;font-variant-numeric:tabular-nums}

/* ---------- Detail header ---------- */
.detail-hero{
  border-radius:var(--radius);padding:26px 28px;color:#fff;margin-bottom:20px;
  background:linear-gradient(120deg,var(--hero1) 0%,var(--hero2) 55%,var(--hero3) 100%);
  box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:18px;flex-wrap:wrap;
}
.detail-hero .avatar{width:56px;height:56px;font-size:1.25rem;border-radius:16px;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.detail-hero h2{font-size:1.35rem;letter-spacing:-.02em}
.detail-hero .sub{color:#c9cdf2;font-size:.86rem;margin-top:3px}
.detail-hero .spacer{flex:1}
.detail-hero .btn-ghost{background:rgba(255,255,255,.14);border-color:transparent;color:#fff;box-shadow:none}
.detail-hero .btn-ghost:hover{background:rgba(255,255,255,.24)}

.subtabs{display:flex;gap:6px;margin:22px 0 16px;flex-wrap:wrap}
.subtabs button{
  padding:8px 15px;border-radius:10px;font-size:.86rem;font-weight:600;color:var(--muted);transition:all .15s;
}
.subtabs button:hover{color:var(--ink)}
.subtabs button.active{background:var(--card);color:var(--accent);box-shadow:var(--shadow);border:1px solid var(--line)}

/* ---------- Filters / toolbar ---------- */
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.toolbar select,.toolbar input{
  padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);
  color:var(--ink);box-shadow:var(--shadow);outline:none;
}
.toolbar select:focus,.toolbar input:focus{border-color:var(--accent)}

/* ---------- Homework status ---------- */
.hw-status{border:none;border-radius:999px;padding:5px 12px;font-size:.78rem;font-weight:700;cursor:pointer;appearance:none;-webkit-appearance:none;text-align:center}
.hw-bekliyor{background:var(--amber-soft);color:var(--amber)}
.hw-yapildi{background:var(--green-soft);color:var(--green)}
.hw-eksik{background:var(--red-soft);color:var(--red)}

/* ---------- Ders ödeme butonu ---------- */
.pay-btn{border-radius:999px;padding:5px 12px;font-size:.78rem;font-weight:700;transition:all .15s;white-space:nowrap}
.pay-no{background:var(--amber-soft);color:var(--amber)}
.pay-no:hover{filter:brightness(.94);transform:translateY(-1px)}
.pay-yes{background:var(--green-soft);color:var(--green)}
.pay-yes:hover{filter:brightness(.94)}

/* ---------- Haftalık takvim ---------- */
.cal-layout{display:grid;grid-template-columns:1fr 225px;gap:18px;align-items:start}
@media(max-width:1000px){.cal-layout{grid-template-columns:1fr}}
.cal-card{padding:14px;overflow-x:auto}
.cal-grid{display:grid;grid-template-columns:46px repeat(7,minmax(92px,1fr));min-width:740px}
.cal-dayhead{
  text-align:center;font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;
  letter-spacing:.05em;padding:6px 2px 10px;border-bottom:1px solid var(--line);
}
.cal-timecol{position:relative;border-bottom:1px solid transparent}
.cal-time{
  position:absolute;right:8px;transform:translateY(-6px);
  font-size:.68rem;color:var(--muted);font-variant-numeric:tabular-nums;
}
.cal-col{position:relative;border-left:1px solid var(--line)}
.cal-line{position:absolute;left:0;right:0;border-top:1px solid var(--line);pointer-events:none}
.cal-line.half{border-top-style:dashed;opacity:.45}
.cal-block{
  position:absolute;left:3px;right:3px;border-radius:8px;color:#fff;overflow:hidden;
  padding:4px 7px;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;
  box-shadow:0 4px 10px -4px rgba(30,33,56,.4);z-index:2;font-size:.7rem;line-height:1.25;
}
.cal-block:active{cursor:grabbing;z-index:5}
.cal-block b{display:block;font-size:.73rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-block .cal-hours{opacity:.85;font-variant-numeric:tabular-nums}
.cal-block .cal-x{
  position:absolute;top:2px;right:3px;width:16px;height:16px;border-radius:5px;color:#fff;
  font-size:.75rem;line-height:1;display:grid;place-items:center;opacity:0;transition:opacity .15s;background:rgba(0,0,0,.25);
}
.cal-block:hover .cal-x{opacity:1}
.cal-resize{
  position:absolute;bottom:0;left:0;right:0;height:9px;cursor:ns-resize;
  display:flex;align-items:flex-end;justify-content:center;
}
.cal-resize::after{content:'';width:26px;height:3px;border-radius:2px;background:rgba(255,255,255,.55);margin-bottom:2px}
.cal-side{padding:16px}
.cal-side h3{font-size:.92rem;font-weight:700;margin-bottom:4px}
.cal-side .hint{font-size:.76rem;color:var(--muted);margin-bottom:12px;line-height:1.45}
.cal-chip{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:9px 11px;border:1px solid var(--line);border-radius:11px;margin-bottom:8px;
  font-size:.85rem;font-weight:600;cursor:grab;background:var(--field-bg);transition:all .15s;
}
.cal-chip:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.cal-chip:active{cursor:grabbing}
.cal-chip span{font-size:.72rem;color:var(--muted);font-weight:500;white-space:nowrap}

/* ---------- Empty state ---------- */
.empty{
  text-align:center;padding:52px 24px;color:var(--muted);
}
.empty .emoji{font-size:2rem;margin-bottom:10px}
.empty b{display:block;color:var(--ink);font-size:1.02rem;margin-bottom:5px}
.empty p{font-size:.87rem;max-width:380px;margin:0 auto}

/* ---------- Modal ---------- */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(20,22,40,.45);backdrop-filter:blur(3px);
  display:none;align-items:flex-start;justify-content:center;z-index:50;padding:6vh 16px;overflow-y:auto;
}
.modal-backdrop.open{display:flex}
.modal{
  background:var(--card);border-radius:18px;box-shadow:var(--shadow-lg);
  width:100%;max-width:480px;padding:26px 26px 24px;animation:pop .18s ease;
}
@keyframes pop{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.modal h3{font-size:1.1rem;margin-bottom:18px;letter-spacing:-.01em}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.form-grid .full{grid-column:1/-1}
.field label{display:block;font-size:.78rem;font-weight:600;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{
  width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--field-bg);
  outline:none;transition:border .15s;color:var(--ink);color-scheme:light dark;
}
.field textarea{resize:vertical;min-height:64px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);background:var(--card)}
.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}

/* ---------- Chart ---------- */
.chart-box{padding:20px 22px}
.chart-box svg{width:100%;height:auto;display:block}
.chart-legend{display:flex;gap:14px;font-size:.78rem;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.chart-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}

/* ---------- Telafi / erteleme ---------- */
.telafi-panel{border-left:4px solid var(--amber);margin-bottom:18px}
.bills-panel{border-left:4px solid var(--blue);margin-bottom:18px}
.cal-block.postponed{opacity:.55;outline:2px dashed rgba(255,255,255,.75);outline-offset:-2px}

/* ---------- Öğrenci modu ---------- */
body.sm .main::before{
  content:'👁 Öğrenci Modu';
  position:fixed;top:14px;right:16px;z-index:40;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;
  padding:6px 14px;border-radius:999px;font-size:.75rem;font-weight:700;
  box-shadow:0 6px 16px -6px var(--glow);
}
.sidebar-foot button.sm-on{color:#fff;background:var(--sb-hover)}
.sidebar-foot button.sm-on svg{color:var(--accent2)}

/* ---------- Kişisel bölümler ---------- */
.nav-label{
  font-size:.64rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--sb-muted);padding:13px 12px 5px;
}
.personal-panel{border-left:4px solid var(--violet);margin-bottom:18px}
.progress{height:6px;border-radius:4px;background:var(--line);overflow:hidden;width:110px;flex-shrink:0}
.progress i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.bk-okunuyor{background:var(--blue-soft);color:var(--blue)}
.wk-day{margin-bottom:16px}
.wk-day:last-child{margin-bottom:0}
.wk-day h4{
  font-size:.76rem;font-weight:700;color:var(--muted);text-transform:uppercase;
  letter-spacing:.06em;margin-bottom:8px;display:flex;align-items:center;gap:8px;
}
.wk-item{
  display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);
  border-radius:12px;margin-bottom:8px;background:var(--field-bg);flex-wrap:wrap;
}
.wk-item.done .t{opacity:.55;text-decoration:line-through}
.wk-item .t{font-weight:700}
.wk-item .d{flex-basis:100%;font-size:.8rem;color:var(--muted);line-height:1.45}
.wk-item.wk-today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.cal-allday-label{
  font-size:.6rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;
  display:flex;align-items:center;justify-content:flex-end;padding:5px 8px 5px 0;border-bottom:1px solid var(--line);
}
.cal-allday{
  border-bottom:1px solid var(--line);border-left:1px solid var(--line);
  padding:4px 3px;display:flex;flex-direction:column;gap:3px;min-width:0;
}
.bill-chip{
  display:block;width:100%;text-align:left;font-size:.66rem;font-weight:700;padding:3px 6px;border-radius:6px;
  background:var(--blue-soft);color:var(--blue);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:filter .15s,transform .15s;
}
.bill-chip:hover{filter:brightness(.93);transform:translateY(-1px)}
.bill-chip.paid{background:var(--green-soft);color:var(--green);opacity:.72;text-decoration:line-through}
.bill-chip.late{background:var(--red-soft);color:var(--red)}
.bill-chip.sub{background:var(--violet-soft);color:var(--violet)}
.bill-chip.wo{background:var(--green-soft);color:var(--green)}
.bill-chip.hw{background:var(--amber-soft);color:var(--amber)}
.bill-chip.exam{background:var(--rose-soft);color:var(--rose)}
.bill-chip.rem{background:var(--blue-soft);color:var(--blue)}
/* Müfredat */
.curr-progress{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px}
.curr-progress .lbl{display:flex;align-items:baseline;gap:6px;font-size:.8rem;color:var(--muted);margin-bottom:5px}
.curr-progress .lbl b{font-size:1rem;color:var(--ink)}
.curr-item{display:flex;align-items:flex-start;gap:11px;padding:10px 13px;border:1px solid var(--line);
  border-radius:11px;margin-bottom:7px;background:var(--field-bg)}
.curr-item.done{border-color:color-mix(in srgb,var(--green) 45%,var(--line))}
.curr-item.done .t{color:var(--muted)}
.curr-item input[type=checkbox]{width:17px;height:17px;margin-top:2px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.curr-item .t{font-weight:600;font-size:.9rem}

.warn-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);

.rem-alert-row .when.today{color:var(--amber);border-color:var(--amber)}
.rem-alert-row .when.late{color:var(--red);border-color:var(--red)}
.rem-alert-row .when.tomorrow{color:var(--blue);border-color:var(--blue)}

.memo .memo-foot{display:flex;align-items:center;justify-content:space-between;font-size:.75rem;color:var(--muted);margin-top:4px}
.rem-item{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--field-bg)}
.rem-item.done .t{opacity:.55;text-decoration:line-through}
.rem-item.late{border-color:var(--red)}

.rem-item .t{font-weight:600;font-size:.92rem}
.rem-item .m{font-size:.8rem;color:var(--muted);margin-top:2px}

}

<script>
/* ================= VERİ ================= */
const KEY = 'ogrenciTakipV1';
const SUBJECTS = [
  {n:'Matematik', bg:'var(--blue-soft)',  fg:'var(--blue)'},
  {n:'Geometri',  bg:'var(--cyan-soft)',  fg:'var(--cyan)'},
  {n:'Fizik',     bg:'var(--violet-soft)',fg:'var(--violet)'},

/* ================= MÜFREDAT (YKS · mevcut MEB programı) =================
   e: 1 = yalnızca TYT, 2 = yalnızca AYT, 3 = her ikisi.
   Kaynaklar farklı isimlendirme kullandığı için liste birleştirilmiştir;
   panelden konu ekleyip gereksizleri gizleyebilirsin. */
const _C = (str, e) => str.split('|').map(t => ({t: t.trim(), e}));
const CURRICULUM = {
  'Matematik': [
    ..._C("Temel Kavramlar|Sayı Basamakları|Bölme ve Bölünebilme|EBOB - EKOK|Rasyonel Sayılar|Basit Eşitsizlikler|Mutlak Değer|Üslü Sayılar|Köklü Sayılar|Çarpanlara Ayırma|Oran - Orantı|Denklem Çözme|Problemler|Kümeler ve Kartezyen Çarpım|Fonksiyonlar|Polinomlar|2. Dereceden Denklemler|Permütasyon ve Kombinasyon|Olasılık|Veri ve İstatistik", 3),

  ],
  'Geometri': [
    ..._C("Doğruda Açılar|Üçgende Açılar|Dik Üçgen ve Öklid Bağıntıları|İkizkenar ve Eşkenar Üçgen|Üçgende Açıortay|Üçgende Kenarortay|Üçgende Eşlik ve Benzerlik|Üçgende Alan|Açı - Kenar Bağıntıları|Çokgenler|Paralelkenar|Dikdörtgen, Kare ve Eşkenar Dörtgen|Yamuk|Deltoid|Çember ve Daire|Çemberde Açı|Çemberde Uzunluk ve Alan|Analitik Geometri: Nokta ve Doğru|Katı Cisimler", 3),
    ..._C("Çemberin Analitiği|Vektörler|Dönüşüm Geometrisi|Konikler|Uzay Geometri", 2),

  'Fizik': [
    ..._C("Fizik Bilimine Giriş|Madde ve Özellikleri|Hareket ve Kuvvet|Dinamik|İş, Güç ve Enerji|Isı, Sıcaklık ve Genleşme|Basınç|Kaldırma Kuvveti|Elektrostatik|Elektrik Akımı ve Devreler|Mıknatıs ve Manyetik Alan|Dalgalar|Optik", 3),
    ..._C("Vektörler|Bağıl Hareket|Newton Hareket Yasaları|Atışlar|Tork ve Denge|Kütle Merkezi|Basit Makineler|İtme ve Momentum|Elektriksel Kuvvet ve Elektriksel Alan|Elektriksel Potansiyel|Paralel Levhalar ve Sığa|Manyetik Kuvvet ve Uygulamaları|İndüksiyon ve Alternatif Akım|Transformatörler|Düzgün Çembersel Hareket|Basit Harmonik Hareket|Dalga Mekaniği ve Elektromanyetik Dalgalar|Kütle Çekim ve Kepler Yasaları|Atom Fiziğine Giriş ve Radyoaktivite|Modern Fizik|Modern Fiziğin Teknolojideki Uygulamaları", 2),

  'Kimya': [
    ..._C("Kimya Bilimi|Atom ve Periyodik Sistem|Kimyasal Türler Arası Etkileşimler|Maddenin Halleri|Doğa ve Kimya|Kimyanın Temel Kanunları|Mol Kavramı ve Kimyasal Hesaplamalar|Karışımlar|Asitler, Bazlar ve Tuzlar|Kimya Her Yerde", 3),
    ..._C("Modern Atom Teorisi|Gazlar|Sıvı Çözeltiler ve Çözünürlük|Kimyasal Tepkimelerde Enerji|Kimyasal Tepkimelerde Hız|Kimyasal Denge|Asit - Baz Dengesi|Çözünürlük Dengesi|Kimya ve Elektrik|Karbon Kimyasına Giriş|Organik Bileşikler|Organik Tepkimeler|Enerji Kaynakları ve Bilimsel Gelişmeler", 2),
  ],
  'Biyoloji': [
    ..._C("Canlıların Ortak Özellikleri|Canlıların Yapısındaki Temel Bileşikler|Hücre ve Organelleri|Hücre Zarından Madde Geçişi|Canlıların Sınıflandırılması|Mitoz ve Eşeysiz Üreme|Mayoz ve Eşeyli Üreme|Kalıtım|Ekosistem Ekolojisi|Güncel Çevre Sorunları|Sindirim Sistemi|Dolaşım ve Bağışıklık Sistemi|Solunum Sistemi|Boşaltım Sistemi|Destek ve Hareket Sistemi|Sinir Sistemi|Duyu Organları|Endokrin Sistem", 3),

function load(){

      d.lessons = d.lessons || []; d.payments = d.payments || []; d.homeworks = d.homeworks || []; d.exams = d.exams || [];
      d.schedule = d.schedule || []; d.bills = d.bills || [];
      d.workouts = d.workouts || []; d.books = d.books || []; d.myClasses = d.myClasses || []; d.subs = d.subs || []; d.studies = d.studies || []; d.reminders = d.reminders || []; d.memos = d.memos || []; d.currHidden = d.currHidden || []; d.currExtra = d.currExtra || []; d.myCourses = d.myCourses || []; d.plans = d.plans || [];
      // Eski ders blokları: aynı koddan tek bir "ders" tanımı üret ve blokları ona bağla
      d.myClasses.forEach(b=>{
        if(b.cid) return;
        const kod = (b.code||'').trim() || 'Ders';
        let k = d.myCourses.find(x=>x.code===kod);
        if(!k){ k = {id:'c'+Math.random().toString(36).slice(2,9), code:kod, name:b.name||'', room:b.room||'', dur:+b.dur||60}; d.myCourses.push(k); }
        b.cid = k.id; delete b.code; delete b.name;
        if(b.room === k.room) delete b.room;
      });
      // Eski "Notlar" bölümü kaldırıldı: notlar artık GitHub deposundan okunur; eski kayıtlar ve tarayıcı dosya deposu temizlenir
      if(d.notes){ delete d.notes; try{ indexedDB.deleteDatabase('ogrenciTakipDosyalar'); }catch(e){} }
      d.students.forEach(x=>{ delete x.driveFolder; });
      // Eski haftalık şablon bloklarını gerçek ders kayıtlarına dönüştür (tek seferlik)
      if(d.schedule.length){
        const mon = new Date(); mon.setDate(mon.getDate() - ((mon.getDay()+6)%7));
        d.schedule.forEach(b=>{
          const dt = new Date(mon); dt.setDate(dt.getDate() + (b.day||0));
          const s = d.students.find(x=>x.id===b.sid);
          const hours = (b.dur||90)/60;
          d.lessons.push({
            id: b.id, sid: b.sid, subject: 'Matematik', hours,
            date: `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`,
            fee: Math.round(hours * (s ? (+s.rate||0) : 0)), topic: '', start: b.start
          });
        });
        d.schedule = [];
      }
      // Saati olmayan eski derslere varsayılan saat ata
      d.lessons.forEach(l=>{ if(l.start==null) l.start = 18*60; });
      // Ödeme tarihi: derse bağlı eski ödeme kayıtlarından türet
      d.lessons.forEach(l=>{ if(l.paid && !l.paidAt){ const pm = (d.payments||[]).find(p=>p.lessonId===l.id); l.paidAt = pm ? pm.date : l.date; } });
      return d;
    }
  }catch(e){}
  return {students:[], lessons:[], payments:[], homeworks:[], exams:[], schedule:[], bills:[], workouts:[], books:[], myClasses:[], subs:[], studies:[], reminders:[], memos:[], currHidden:[], currExtra:[], myCourses:[], plans:[]};
}

/* ================= YARDIMCILAR ================= */
const fmtTL = n => new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:0}).format(n||0);
const fmtTLd = n => new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:2}).format(n||0);
const fmtDate = d => d ? new Date(d+'T12:00').toLocaleDateString('tr-TR',{day:'numeric',month:'short',year:'numeric'}) : '—';
const localDate = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today = () => localDate(new Date());
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byDateDesc = (a,b) => (b.date||'').localeCompare(a.date||'');
/* Göreli zaman: "az önce", "3 saat önce", "dün", "5 gün önce", sonrası tarih */
function fmtAgo(ts){
  if(!ts) return '';
  const diff = Date.now() - ts, m = Math.floor(diff/60000), h = Math.floor(m/60), d = Math.floor(h/24);
  if(m < 1) return 'az önce';
  if(m < 60) return `${m} dk önce`;
  if(h < 24) return `${h} saat önce`;
  if(d === 1) return 'dün';
  if(d < 14) return `${d} gün önce`;
  return new Date(ts).toLocaleDateString('tr-TR',{day:'numeric',month:'short'});
}
/* Öğrencinin sayfasına son girişi (öğrenci sayfası açılınca tik belgesine yazılır) */
function lastSeenHtml(s){
  const ts = +s.lastSeen || 0;
  if(!ts) return '<span style="color:var(--muted);font-weight:500">hiç girmedi</span>';
  const days = (Date.now()-ts)/86400000;
  const col = days < 3 ? 'var(--green)' : days < 7 ? 'var(--amber)' : 'var(--red)';
  const full = new Date(ts).toLocaleString('tr-TR',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'});
  return `<span style="color:${col}" title="${esc(full)}">${fmtAgo(ts)}</span>`;
}

/* Ders sayımı: ertelenmiş (eski kayıt) dersler hiçbir hesaba girmez */
const isActive   = l => l.status !== 'ertelendi' && !!l.date;
const isBillable = l => isActive(l) && l.date <= today();   // işlenmiş ders
const isPlanned  = l => isActive(l) && l.date > today();    // ileri tarihli ders
const sumFee = list => list.reduce((t,l)=>t+(+l.fee||0),0);
const forSid = (list, sid) => sid ? list.filter(x=>x.sid===sid) : list;

/* Hafta numaralandırma: 21 Eylül 2026 Pazartesi = 0. hafta */
const WEEK_ANCHOR = '2026-09-21';
function mondayOf(ds){ const d = new Date(ds+'T12:00'); d.setDate(d.getDate() - ((d.getDay()+6)%7)); return localDate(d); }
function weekNo(ds){ const n = Math.round((new Date(mondayOf(ds)+'T12:00') - new Date(WEEK_ANCHOR+'T12:00')) / 6048e5); return n >= 0 ? n : null; }
function weekRangeLabel(mon){
  const a = new Date(mon+'T12:00'), b = new Date(shiftDate(mon,6)+'T12:00');
  const m = d => d.toLocaleDateString('tr-TR',{month:'short'});
  return a.getMonth()===b.getMonth() ? `${a.getDate()}–${b.getDate()} ${m(a)}` : `${a.getDate()} ${m(a)} – ${b.getDate()} ${m(b)}`;
}
function weekTitle(mon){ const n = weekNo(mon); return (n!=null ? `${n}. hafta · ` : '') + weekRangeLabel(mon); }
function weekRange(){ const mon = mondayOf(today()); return [mon, shiftDate(mon,6)]; }
const inWeek = ds => { const [a,b] = weekRange(); return ds >= a && ds <= b; };

/* Öğrenci (sid) ya da tüm öğrenciler (sid=null) için tutarlar */
function unpaidLessons(sid){ return forSid(state.lessons, sid).filter(l=>isBillable(l) && !l.paid).sort((a,b)=>a.date.localeCompare(b.date)); }
function unpaidTotal(sid){ return sumFee(unpaidLessons(sid)); }
function weekLessons(sid){ return forSid(state.lessons, sid).filter(l=>isActive(l) && inWeek(l.date)); }
function weekExpected(sid){ return sumFee(weekLessons(sid)); }
function weekCollected(sid){ return sumFee(forSid(state.lessons, sid).filter(l=>l.paid && l.paidAt && inWeek(l.paidAt))); }
function collectedInMonth(sid, ym){ return sumFee(forSid(state.lessons, sid).filter(l=>l.paid && (l.paidAt||'').startsWith(ym))); }
function plannedLessons(sid){ return forSid(state.lessons, sid).filter(isPlanned); }
function totalHours(sid){ return forSid(state.lessons, sid).filter(isBillable).reduce((t,l)=>t+(+l.hours||0),0); }
function debt(sid){ return unpaidTotal(sid); } // >0 ise ödenmemiş ders var
/* Haftalık potansiyel: yalnızca girilmiş dersler, bu hafta ve sonrası */
function potentialWeeks(sid){
  const cur = mondayOf(today()); const map = {};
  forSid(state.lessons, sid).filter(l=>isActive(l) && mondayOf(l.date) >= cur).forEach(l=>{
    const m = mondayOf(l.date); const w = map[m] = map[m] || {mon:m, count:0, fee:0};
    w.count++; w.fee += +l.fee||0;
  });
  return Object.values(map).sort((a,b)=>a.mon.localeCompare(b.mon));
}
function debtBadge(v){ // v = ödenmemiş toplam
  if(v > 0)  return `<span class="chip badge-neg">${fmtTL(v)} borç</span>`;
  if(v < 0)  return `<span class="chip badge-pos">${fmtTL(-v)} avans</span>`;
  return `<span class="chip badge-zero">Ödendi</span>`;
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 2200);
}

function lastExamNet(sid){
  const ex = state.exams.filter(e=>e.sid===sid).sort(byDateDesc)[0];
  return ex ? (+ex.net).toLocaleString('tr-TR')+' net' : '—';
}

/* ================= TABLOLAR ================= */

    <td style="white-space:nowrap">${fmtDate(l.date)}${l.start!=null?`<span class="row-note">${fmtClock(l.start)}</span>`:''}</td>
    ${showStudent?`<td class="student-cell">${avatarHtml(l.sid,'sm')}${esc(studentName(l.sid))}</td>`:''}
    <td style="white-space:nowrap">${subjectChip(l.subject)}${l.status==='ertelendi'?' <span class="chip hw-bekliyor">⏳ Ertelendi</span>':isPlanned(l)?' <span class="chip badge-zero" title="Ders günü gelince tahakkuk eder">Planlı</span>':''}</td>

      ? '<span style="color:var(--muted);font-size:.8rem">tahakkuk yok</span>'
      : l.paid
      ? `<button class="pay-btn pay-yes" onclick="toggleLessonPaid('${l.id}')" title="Ödemeyi geri almak için tıkla">Ödendi ✓</button>`
      : isPlanned(l)
      ? `<button class="pay-btn" style="background:var(--field-bg);color:var(--muted)" onclick="toggleLessonPaid('${l.id}')" title="Henüz tahakkuk etmedi; istersen peşin ödeme al">Peşin Al</button>`
      : `<button class="pay-btn pay-no" onclick="toggleLessonPaid('${l.id}')" title="Ders ücretini ödeme olarak kaydet">₺ Ödeme Al</button>`}</td>`}
    <td style="color:var(--muted);font-size:.85rem">${esc(l.topic||'')}</td>
    <td style="text-align:right;white-space:nowrap">
      <button class="icon-btn" ${l.status==='ertelendi'?'style="color:var(--amber)"':''} onclick="openRescheduleForm('${l.id}')" title="Telafi · dersi yeni tarihe taşı">${SVG_CLOCK}</button>
      <button class="icon-btn" onclick="openLessonForm('${l.id}')" title="Düzenle">${SVG_EDIT}</button>
      <button class="icon-btn danger" onclick="delItem('lessons','${l.id}')" title="Sil">${SVG_DEL}</button>
    </td>
  </tr>`).join('')}</tbody></table></div>`;
}
/* Potansiyel kazanç şeridi: bu hafta ve sonrası, yalnızca girilmiş dersler */
function potentialStrip(sid){
  const weeks = potentialWeeks(sid); if(!weeks.length) return '';
  const cur = mondayOf(today());
  return `<div class="card panel" style="margin-bottom:18px">
    <h3>Potansiyel Kazanç <span class="chip badge-zero">${weeks.length} hafta · ${fmtTL(weeks.reduce((t,w)=>t+w.fee,0))}</span></h3>
    <div class="pot-strip">${weeks.map(w=>{ const n = weekNo(w.mon); return `<div class="pot-box ${w.mon===cur?'cur':''}">
      ${n!=null ? `<b>${n}. hafta</b><span class="r">${weekRangeLabel(w.mon)}</span>` : `<b>${weekRangeLabel(w.mon)}</b><span class="r">numarasız</span>`}
      <span class="v">${w.count} ders · ${fmtTL(w.fee)}</span></div>`; }).join('')}</div>
  </div>`;
}
/* Ödenmemiş dersler: haftaya göre gruplu, en yeni hafta üstte */
function unpaidPanel(sid, showStudent){
  const list = unpaidLessons(sid);
  const groups = {};
  list.forEach(l=>{ const m = mondayOf(l.date); (groups[m] = groups[m] || []).push(l); });
  const weeks = Object.keys(groups).sort((a,b)=>b.localeCompare(a));
  const dayLbl = ds => new Date(ds+'T12:00').toLocaleDateString('tr-TR',{day:'numeric',month:'short',weekday:'short'}).replace(/\s+/,' ');
  const body = weeks.length ? weeks.map(mon=>{
    const ls = groups[mon].sort((a,b)=>a.date.localeCompare(b.date) || (a.start||0)-(b.start||0));
    const days = [...new Set(ls.map(l=>l.date))].map(dayLbl).join(', ');
    return `<div class="wk-group">
      <div class="wk-head"><b>${weekTitle(mon)}</b><span class="days">${days}</span><span class="tot">${fmtTL(sumFee(ls))}</span></div>
      <div class="table-wrap"><table><tbody>${ls.map(l=>`<tr>
        <td style="white-space:nowrap">${fmtDate(l.date)}${l.start!=null?`<span class="row-note">${fmtClock(l.start)}</span>`:''}</td>
        ${showStudent?`<td class="student-cell">${avatarHtml(l.sid,'sm')}${esc(studentName(l.sid))}</td>`:''}
        <td>${subjectChip(l.subject)}</td>
        <td class="num" style="color:var(--muted)">${l.hours} sa</td>
        <td class="num">${fmtTL(l.fee)}</td>
        <td style="text-align:right"><button class="pay-btn pay-no" onclick="toggleLessonPaid('${l.id}')">₺ Ödeme Al</button></td>
      </tr>`).join('')}</tbody></table></div>
    </div>`; }).join('') : emptyState('✅','Ödeme bekleyen ders yok','İşlenen tüm derslerin ödemesi alınmış.');
  return `<div class="card panel" style="margin-bottom:18px;padding-bottom:${weeks.length?'8px':'20px'}">
    <h3>Ödenmemiş Dersler ${list.length?`<span class="chip badge-neg">${list.length} ders · ${fmtTL(sumFee(list))}</span>`:''}</h3>
    ${body}
  </div>`;
}

function studyWeekSummary(sid){
  const mon = new Date(); mon.setDate(mon.getDate() - ((mon.getDay()+6)%7));
  const from = `${mon.getFullYear()}-${String(mon.getMonth()+1).padStart(2,'0')}-${String(mon.getDate()).padStart(2,'0')}`;
  const wk = (state.studies||[]).filter(x=>x.sid===sid && x.date >= from);
  if(!wk.length) return '';
  const bySub = {}; let tot = 0;
  wk.forEach(x=>{ const h = +x.hours||0; tot += h; bySub[x.subject] = (bySub[x.subject]||0) + h; });
  const chips = Object.entries(bySub).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<span class="chip" style="background:var(--field-bg);border:1px solid var(--line)">${esc(k)} · ${v.toLocaleString('tr-TR')} sa</span>`).join(' ');
  return `<div class="card panel" style="margin-bottom:16px"><h3>Bu Hafta <span class="chip badge-zero">${wk.length} kayıt · ${tot.toLocaleString('tr-TR')} sa</span></h3><div style="display:flex;gap:6px;flex-wrap:wrap">${chips}</div></div>`;
}

/* Genel deneme ders/soru yapısı */
const GENEL_NETS = {
  TYT: [['Türkçe',40],['Sosyal',20],['Matematik',40],['Fizik',7],['Kimya',7],['Biyoloji',6]],
  AYT: [['Matematik',40],['Fizik',14],['Kimya',13],['Biyoloji',13]],
};
const BRANS_MAX = 40;
const EXAM_DERS_FILTERS = ['Türkçe','Sosyal','Matematik','Fizik','Kimya','Biyoloji'];

      <option value="genel" ${e.kind!=='brans'?'selected':''}>Genel Deneme</option>

function renderExamFields(){
  const e = window._editExam || {};
  const kind = fv('f_kind');
  const box = document.getElementById('examFields');
  if(kind==='brans'){
    const prev = document.getElementById('f_bsub');
    const bs = (prev && prev.value) || e.bransSubject || 'Matematik';
    box.innerHTML = `<div class="form-grid">
      <div class="field"><label>Ders</label><select id="f_bsub" onchange="renderExamFields()">
        <option ${bs==='Matematik'?'selected':''}>Matematik</option>
        <option ${bs==='Türkçe'?'selected':''}>Türkçe</option>
      </select></div>
      <div class="field"><label>Net (40 üzerinden) *</label><input id="f_bnet" type="number" min="-10" max="${BRANS_MAX}" step="0.25" value="${e.kind==='brans'?(e.net??''):''}" placeholder="Örn. 32,5"></div>
      <div class="field full"><label>Süre (dakika)${bs==='Türkçe'?' *':''}</label><input id="f_bsure" type="number" min="1" value="${e.sure??''}" placeholder="Örn. 35"></div>
    </div>`;
  } else {
    const prev = document.getElementById('f_gtype');
    const type = (prev && prev.value) || (GENEL_NETS[e.type] ? e.type : 'TYT');
    box.innerHTML = `<div class="form-grid">
      <div class="field full"><label>Sınav</label><select id="f_gtype" onchange="renderExamFields()">
        <option ${type==='TYT'?'selected':''}>TYT</option>
        <option ${type==='AYT'?'selected':''}>AYT</option>
      </select></div>
      ${GENEL_NETS[type].map(([n,max])=>`
      <div class="field"><label>${n} <span style="opacity:.6">(en çok ${max})</span></label>
        <input class="gnet" data-sub="${n}" data-max="${max}" type="number" step="0.25" min="-10" max="${max}"
          value="${e.nets && e.nets[n]!=null ? e.nets[n] : ''}" placeholder="net"></div>`).join('')}
    </div>`;
  }
}
function saveExam(id){
  const kind = fv('f_kind');
  const base = {sid:fv('f_sid'), date:fv('f_date')||today(), name:fv('f_ename'), note:fv('f_enote'), kind, updatedAt:Date.now()};
  let data;
  if(kind==='brans'){
    const sub = fv('f_bsub');
    const net = parseFloat(fv('f_bnet'));
    const sure = parseFloat(fv('f_bsure'));
    if(isNaN(net) || net > BRANS_MAX){ toast('Branş neti 40 üzerinden girilmeli'); return; }
    if(sub==='Türkçe' && (isNaN(sure) || sure<=0)){ toast('Türkçe branş denemesi için süre (dk) girilmeli'); return; }
    data = {...base, type:'Branş', bransSubject:sub, net, sure:isNaN(sure)?null:sure, nets:null};
  } else {
    const type = fv('f_gtype');
    const nets = {}; let tot = 0, any = false, err = null;
    document.querySelectorAll('.gnet').forEach(inp=>{
      const v = inp.value.trim(); if(v==='') return;
      const num = parseFloat(v.replace(',','.')), max = +inp.dataset.max;
      if(isNaN(num) || num > max){ err = `${inp.dataset.sub} neti en çok ${max} olabilir`; return; }
      nets[inp.dataset.sub] = num; tot += num; any = true;
    });
    if(err){ toast(err); return; }
    if(!any){ toast('En az bir ders için net gir'); return; }
    data = {...base, type, nets, net:Math.round(tot*100)/100, sure:null, bransSubject:null};
  }
  if(id){ Object.assign(state.exams.find(x=>x.id===id), data); toast('Deneme güncellendi'); }
  else { state.exams.push({id:uid(), ...data}); toast('Deneme eklendi'); }
  save(); closeModal(); render();
}
/* Bir denemenin belirli ders için neti (yoksa null) */
function examNetFor(e, ders){
  if(!ders) return +e.net || 0;
  if(e.kind==='brans') return e.bransSubject===ders ? (+e.net||0) : null;
  if(e.nets && e.nets[ders]!=null) return +e.nets[ders];
  return null;
}
function examKindLabel(e){
  if(e.kind==='brans') return `${subjectChip(e.bransSubject)} <span class="chip badge-zero">Branş</span>`;
  return subjectChip(e.type||'Genel');
}
function netBreakdown(e){
  if(!e.nets) return '';
  const short = {'Türkçe':'Tür','Sosyal':'Sos','Matematik':'Mat','Fizik':'Fiz','Kimya':'Kim','Biyoloji':'Biy'};
  return Object.entries(e.nets).map(([k,v])=>`${short[k]||k} ${(+v).toLocaleString('tr-TR')}`).join(' · ');
}

function delItem(coll, id){
  if(!confirm('Bu kayıt silinsin mi?')) return;
  if(coll==='payments'){
    // dersten oluşturulan bir ödeme silinirse dersin "ödendi" işaretini kaldır
    const p = state.payments.find(x=>x.id===id);
    if(p && p.lessonId){
      const l = state.lessons.find(x=>x.id===p.lessonId);
      if(l) l.paid = false;
    }
  }
  if(coll==='exams'){ const e = state.exams.find(x=>x.id===id); if(e && e.srcId) removeStudentInput(e.sid, 'exams', e.srcId); }
  if(coll==='studies'){ const x = (state.studies||[]).find(y=>y.id===id); if(x) removeStudentInput(x.sid, 'studies', x.id); }
  state[coll] = state[coll].filter(x=>x.id!==id);
  save(); render(); toast('Kayıt silindi');
}

/* Telafi: dersi yeni tarihe taşı (ayrı bir durum yok, tarih değişikliğidir) */
function openRescheduleForm(id){
  const l = state.lessons.find(x=>x.id===id); if(!l) return;
  if(l.paid){ toast('Ödemesi alınmış ders taşınamaz — önce ödemeyi geri al'); return; }
  openModal(`
  <h3>Telafi · Yeni Tarih</h3>
  <p class="hint-text" style="margin:-8px 0 14px">${esc(studentName(l.sid))} · ${esc(l.subject)} · ${fmtDate(l.date)}${l.start!=null?' '+fmtClock(l.start):''}. Ders seçtiğin tarihe taşınır; o haftanın potansiyeline geçer.</p>
  <div class="form-grid">
    <div class="field"><label>Yeni Tarih</label><input id="r_date" type="date" value="${shiftDate(l.date, 7)}"></div>
    <div class="field"><label>Saat</label><input id="r_start" type="time" value="${l.start!=null?fmtClock(l.start):'18:00'}" step="1800"></div>
  </div>
  <div class="modal-actions">
    <button class="btn btn-ghost" onclick="closeModal()">Vazgeç</button>
    <button class="btn btn-primary" onclick="saveReschedule('${id}')">Taşı</button>
  </div>`);
}
function saveReschedule(id){
  const l = state.lessons.find(x=>x.id===id); if(!l) return;
  const date = fv('r_date'); if(!date){ toast('Tarih gerekli'); return; }
  const stv = fv('r_start');
  if(/^\d{1,2}:\d{2}/.test(stv)) l.start = (+stv.slice(0,stv.indexOf(':')))*60 + +stv.slice(stv.indexOf(':')+1, stv.indexOf(':')+3);
  const old = l.date; l.date = date; delete l.status;
  save(); closeModal(); render();
  toast(`Ders ${fmtDate(old)} → ${fmtDate(date)} tarihine taşındı`);
}
function shiftDate(ds, days){
  const d = new Date(ds + 'T12:00'); d.setDate(d.getDate() + days);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
/* Geçen haftanın derslerini görüntülenen haftaya kopyala */
function copyPrevWeek(){
  const cur = calWeekDates();
  const prevLessons = state.lessons.filter(l=>l.date && cur.includes(shiftDate(l.date, 7)));
  if(!prevLessons.length){ toast('Geçen haftada kopyalanacak ders yok'); return; }
  let added = 0;
  prevLessons.forEach(l=>{
    const nd = shiftDate(l.date, 7);
    if(state.lessons.some(x=>x.sid===l.sid && x.date===nd && x.start===l.start)) return; // zaten var
    const s = student(l.sid); if(!s) return;
    state.lessons.push({
      id: uid(), sid: l.sid, date: nd, subject: l.subject, hours: l.hours,
      fee: Math.round((+l.hours||0) * (+s.rate||0)), topic: '', start: l.start
    });
    added++;
  });
  save(); render();
  toast(added ? added + ' ders bu haftaya kopyalandı' : 'Bu haftadaki dersler zaten mevcut');
}
/* Ders satırından tek tıkla ödeme al / geri al */
function toggleLessonPaid(id){
  const l = state.lessons.find(x=>x.id===id);
  if(!l) return;
  if(l.status==='ertelendi'){ toast('Bu ders önce yeni tarihe taşınmalı'); return; }
  if(l.paid){
    if(!confirm('Bu dersin ödemesi geri alınsın mı?')) return;
    state.payments = state.payments.filter(p=>p.lessonId!==id);
    l.paid = false; delete l.paidAt;
    toast('Ödeme geri alındı');
  } else {
    state.payments.push({
      id: uid(), sid: l.sid, date: today(), amount: +l.fee||0, method: 'Nakit',
      note: `Ders ödemesi · ${l.subject} (${fmtDate(l.date)})`, lessonId: id
    });
    l.paid = true; l.paidAt = today();
    toast(fmtTL(l.fee) + ' ödeme kaydedildi');
  }
  save(); render();
}

/* ================= GRAFİK (SVG) ================= */
function examChart(list, ders){
  ders = ders || '';
  const title = `Net Gelişimi · ${ders||'Toplam'}`;
  const pts = [...list]
    .filter(e=>ders || e.kind!=='brans') // Toplam görünümünde branş denemeleri kıyasa girmez
    .sort((a,b)=>(a.date||'').localeCompare(b.date||''))
    .map(e=>({...e, _val: examNetFor(e, ders)}))
    .filter(e=>e._val!=null);
  if(pts.length < 2) return `<div class="card chart-box"><h3 style="font-size:.98rem;margin-bottom:8px">${title}</h3>
    <p style="color:var(--muted);font-size:.86rem">Grafik için bu filtrede en az 2 deneme sonucu gerekli.</p></div>`;
  const W=720, H=240, PL=44, PR=16, PT=18, PB=34;
  const nets = pts.map(p=>+p._val);
  let min = Math.min(...nets), max = Math.max(...nets);
  if(min===max){ min-=5; max+=5; }
  const pad = (max-min)*0.15; min=Math.max(0,min-pad); max+=pad;
  const X = i => PL + (W-PL-PR) * (pts.length===1 ? .5 : i/(pts.length-1));
  const Y = v => PT + (H-PT-PB) * (1-(v-min)/(max-min));
  // yatay kılavuz çizgileri
  let grid='', labels='';
  for(let g=0; g<=4; g++){
    const v = min + (max-min)*g/4, y = Y(v);
    grid += `<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`;
    labels += `<text x="${PL-8}" y="${y+4}" text-anchor="end" font-size="10" fill="var(--muted)">${v.toFixed(0)}</text>`;
  }
  const coords = pts.map((p,i)=>[X(i), Y(+p._val)]);
  const line = coords.map((c,i)=>(i?'L':'M')+c[0].toFixed(1)+' '+c[1].toFixed(1)).join(' ');
  const area = line + ` L ${coords[coords.length-1][0].toFixed(1)} ${H-PB} L ${coords[0][0].toFixed(1)} ${H-PB} Z`;
  const hasBrans = pts.some(p=>p.kind==='brans');
  const dots = pts.map((p,i)=>{
    const [x,y]=coords[i];
    const col = p.kind==='brans' ? 'var(--rose)' : 'var(--accent)';
    const kindTxt = p.kind==='brans' ? `Branş · ${p.bransSubject}` : (p.type||'Genel');
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.5" fill="var(--card)" stroke="${col}" stroke-width="2.5">
      <title>${esc(p.name||kindTxt)} · ${kindTxt} · ${fmtDate(p.date)} · ${(+p._val).toLocaleString('tr-TR')} net${p.sure?' · '+p.sure+' dk':''}</title></circle>
      <text x="${x.toFixed(1)}" y="${(y-11).toFixed(1)}" text-anchor="middle" font-size="10.5" font-weight="700" fill="${col}">${(+p._val).toLocaleString('tr-TR')}</text>`;
  }).join('');
  const xLabels = pts.map((p,i)=>{
    if(pts.length>8 && i%2===1) return '';
    return `<text x="${X(i).toFixed(1)}" y="${H-12}" text-anchor="middle" font-size="10" fill="var(--muted)">${new Date(p.date+'T12:00').toLocaleDateString('tr-TR',{day:'numeric',month:'short'})}</text>`;
  }).join('');
  const first = nets[0], last = nets[nets.length-1], diff = last-first;
  const trend = diff>=0
    ? `<span class="chip badge-pos">↑ ${diff.toLocaleString('tr-TR')} net artış</span>`
    : `<span class="chip badge-neg">↓ ${(-diff).toLocaleString('tr-TR')} net düşüş</span>`;
  const legend = hasBrans
    ? `<div class="chart-legend"><span><i style="background:var(--accent)"></i>Genel deneme</span><span><i style="background:var(--rose)"></i>Branş denemesi</span></div>`
    : '';
  return `<div class="card chart-box">
    <h3 style="font-size:.98rem;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center">${title} ${trend}</h3>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
      <defs><linearGradient id="gArea" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--accent)" stop-opacity=".22"/>
        <stop offset="1" stop-color="var(--accent)" stop-opacity="0"/>
      </linearGradient></defs>
      ${grid}${labels}
      <path d="${area}" fill="url(#gArea)"/>
      <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      ${dots}${xLabels}
    </svg>
    ${legend}
  </div>`;
}

/* ================= YEDEKLEME ================= */
function exportData(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ogrenci-takip-yedek-' + today() + '.json';
  a.click(); URL.revokeObjectURL(a.href);
  toast('Yedek dosyası indirildi');
}
function importData(ev){
  const file = ev.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const d = JSON.parse(reader.result);
      if(!d || !Array.isArray(d.students)) throw 0;
      if(!confirm('Mevcut veriler yedekteki verilerle değiştirilecek. Devam edilsin mi?')) return;
      state = {students:d.students||[], lessons:d.lessons||[], payments:d.payments||[], homeworks:d.homeworks||[], exams:d.exams||[], schedule:d.schedule||[], bills:d.bills||[], workouts:d.workouts||[], books:d.books||[], myClasses:d.myClasses||[], subs:d.subs||[], studies:d.studies||[], reminders:d.reminders||[], memos:d.memos||[], currHidden:d.currHidden||[], currExtra:d.currExtra||[], myCourses:d.myCourses||[], plans:d.plans||[]};
      save(); go('dashboard'); toast('Yedek geri yüklendi');
    }catch(e){ toast('Geçersiz yedek dosyası'); }
  };
  reader.readAsText(file);
  ev.target.value = '';
}

/* ================= ÖĞRENCİ NOTLARI (GitHub Pages deposundan okunur) =================
   Panelde not kaydı tutulmaz. PDF'ler öğrenci sayfasıyla aynı depoda
   /notlar/<ogrenci-slug>/<ders>/<seviye>/<dosya>.pdf yolunda durur; öğrenci sayfası bunları
   GitHub API'den listeler. Burada yalnızca slug ve beklenen klasör yolları gösterilir. */
const NOTE_DERS = ['fizik','kimya','matematik'], NOTE_SEVIYE = ['tyt','ayt'];
const SVG_OPEN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';
/* Öğrenci adı → klasör adı: küçük harf, Türkçe karakterler sadeleşmiş, boşluklar "-" (ogrenci.html ile birebir aynı) */
function studentSlug(name){
  const map = {'ç':'c','ğ':'g','ı':'i','ö':'o','ş':'s','ü':'u','Ç':'c','Ğ':'g','İ':'i','I':'i','Ö':'o','Ş':'s','Ü':'u'};
  return String(name||'').trim().replace(/[çğıöşüÇĞİIÖŞÜ]/g, c=>map[c]).toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
}
/* Öğrenci sayfası adresi github.io ise depo bilgisini türet */
function notesRepo(){
  const m = siteUrl().match(/^https?:\/\/([\w-]+)\.github\.io(?:\/([^\/?#]+))?/i);
  return m ? {user:m[1], repo:m[2] || `${m[1]}.github.io`} : null;
}
function studentNotesTab(s){
  const slug = studentSlug(s.name), repo = notesRepo();
  const base = `notlar/${slug}`;
  const gh = repo ? `https://github.com/${repo.user}/${repo.repo}` : '';
  const rows = NOTE_DERS.flatMap(d=>NOTE_SEVIYE.map(v=>{
    const p = `${base}/${d}/${v}/`;
    return `<tr>
      <td style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.84rem">${esc(p)}</td>
      <td style="text-align:right;white-space:nowrap">
        <button class="btn btn-ghost btn-sm" onclick="copyText(${JSON.stringify(p)})">Kopyala</button>
        ${gh ? `<a class="btn btn-ghost btn-sm" href="${esc(`${gh}/upload/main/${p.replace(/\/$/,'')}`)}" target="_blank" rel="noopener">${SVG_OPEN} GitHub'a Yükle</a>` : ''}
      </td></tr>`;
  })).join('');
  return `
  <div class="card panel" style="margin-bottom:16px">
    <h3>Not klasörü ${gh ? `<a class="btn btn-ghost btn-sm" href="${esc(`${gh}/tree/main/${base}`)}" target="_blank" rel="noopener">${SVG_OPEN} GitHub'da Aç</a>` : ''}</h3>
    <p style="font-size:.88rem;color:var(--muted);line-height:1.55;margin-bottom:12px">Notlar panelde tutulmaz; öğrenci sayfasının bulunduğu GitHub deposuna PDF olarak yüklenir. ${esc(s.name.split(' ')[0])}'in sayfası aşağıdaki klasörleri okur ve dosyaları ders / seviye sekmelerinde listeler. Klasörleri ilk dosyayı yüklerken oluşturursun.</p>
    <div class="share-box"><div class="lbl">Öğrenci klasörü (slug)</div><div class="val">${esc(base)}/</div>
      <div class="share-row"><button class="btn btn-ghost btn-sm" onclick="copyText(${JSON.stringify(base+'/')})">Kopyala</button></div></div>
    <div class="share-box"><div class="lbl">Dosya adı biçimi</div><div class="val">YYYY-AA-GG Başlık.pdf</div>
      <div class="hint-text">Örn. <b>2026-03-12 Vektörler.pdf</b>. Tarih isteğe bağlıdır; tarihsiz dosya (örn. <b>Formül Kartı.pdf</b>) yalnızca başlığıyla, listenin altında görünür. Yalnızca .pdf dosyaları listelenir.</div></div>
    ${gh ? '' : `<div class="hint-text" style="color:var(--amber)">Öğrenci sayfası adresi bir github.io adresi değil; GitHub bağlantıları bu yüzden gösterilmiyor. Bulut penceresinden adresi <b>https://KULLANICI.github.io/DEPO</b> biçiminde gir.</div>`}
  </div>
  <div class="card"><div class="table-wrap"><table>
    <thead><tr><th>Beklenen klasör yolları</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table></div></div>`;
}

/* ================= HAFTALIK TAKVİM (ders kayıtlarıyla ortak) ================= */
const CAL_START = 8*60, CAL_END = 23*60, CAL_SLOT = 30, CAL_SLOT_H = 21;
const CAL_DAYS = ['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];
const fmtClock = m => String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0');
const calY = m => (m - CAL_START) / CAL_SLOT * CAL_SLOT_H;
const calColH = () => calY(CAL_END);
let calWeekOff = 0;
function calShiftWeek(n){ calWeekOff = (n===0 ? 0 : calWeekOff + n); render(); }
function calWeekDates(){
  const d = new Date(); d.setDate(d.getDate() + calWeekOff*7);
  d.setDate(d.getDate() - ((d.getDay()+6)%7)); // pazartesi
  return Array.from({length:7}, (_,i)=>{
    const x = new Date(d); x.setDate(x.getDate()+i);
    return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;
  });
}
function calWeekLessons(){
  const dates = calWeekDates();
  return state.lessons.filter(l=>dates.includes(l.date));
}
function lessonDur(l){ return Math.max(CAL_SLOT, Math.round((+l.hours||1)*60)); }
function weekHours(sid){
  const t = calWeekLessons().filter(l=>l.sid===sid).reduce((a,l)=>a+(+l.hours||0),0);
  return (Math.round(t*10)/10).toLocaleString('tr-TR');
}
function lastSubject(sid){
  const l = [...state.lessons].filter(x=>x.sid===sid).sort(byDateDesc)[0];
  return l ? l.subject : 'Matematik';
}
function calBlockHtml(l){
  const s = student(l.sid); if(!s || l.start==null) return '';
  const dur = lessonDur(l);
  const pp = l.status==='ertelendi';
  return `<div class="cal-block${pp?' postponed':''}" data-id="${l.id}" style="top:${calY(l.start)}px;height:${dur/CAL_SLOT*CAL_SLOT_H-2}px;background:${avatarColor(l.sid)}"
    onpointerdown="calMoveStart(event,'${l.id}')" ondblclick="openLessonForm('${l.id}')" title="Düzenlemek için çift tıkla">
    <button class="cal-x" onpointerdown="event.stopPropagation()" onclick="delItem('lessons','${l.id}')" title="Dersi sil">×</button>
    <button class="cal-x" style="right:22px" onpointerdown="event.stopPropagation()" onclick="openRescheduleForm('${l.id}')" title="Telafi · yeni tarihe taşı">⏳</button>
    <b>${esc(s.name)}</b>
    <span class="cal-hours">${fmtClock(l.start)}–${fmtClock(l.start+dur)}</span>
    <span class="cal-hours">${pp ? '⏳ Ertelendi' : esc(l.subject)+(studentMode?'':' · '+fmtTL(l.fee)+(l.paid?' ✓':''))}</span>
    <div class="cal-resize" onpointerdown="calResizeStart(event,'${l.id}')"></div>
  </div>`;
}
function calColInner(di){
  const date = calWeekDates()[di];
  let lines = '';
  for(let m=CAL_START+CAL_SLOT; m<CAL_END; m+=CAL_SLOT){
    lines += `<div class="cal-line ${m%60?'half':''}" style="top:${calY(m)}px"></div>`;
  }
  return lines + calPersonalBlocks(di, date) + state.lessons.filter(l=>l.date===date).map(calBlockHtml).join('');
}
/* Kişisel bloklar (üniversite dersleri + saatli antrenmanlar) — Öğrenci Modunda hiç oluşturulmaz */
function calPersonalBlocks(di, date){
  if(studentMode) return '';
  const cls = state.myClasses.filter(c=>c.day===di).map(c=>{
    const dur = +c.dur||60;
    const oda = mcRoom(c);
    return `<div class="cal-block personal" style="top:${calY(c.start)}px;height:${dur/CAL_SLOT*CAL_SLOT_H-2}px;background:${mcColor(mcCode(c))}"
      onclick="openMyBlockForm('${c.id}')" title="Üniversite dersin — düzenlemek için tıkla">
      <b>🎓 ${esc(mcCode(c))}</b>
      <span class="cal-hours">${fmtClock(c.start)}–${fmtClock(c.start+dur)}${oda?' · '+esc(oda):''}</span>
    </div>`;
  }).join('');
  const wos = state.workouts.filter(w=>w.day===di && w.time!=null).map(w=>{
    const dur = +w.dur||60;
    const done = (w.doneDates||[]).includes(date);
    return `<div class="cal-block personal${done?' wodone':''}" style="top:${calY(w.time)}px;height:${dur/CAL_SLOT*CAL_SLOT_H-2}px;background:var(--green)"
      onclick="openWorkoutForm('${w.id}')" title="Antrenmanın — düzenlemek için tıkla">
      <button class="cal-x" style="opacity:1" onclick="event.stopPropagation();toggleWorkoutDoneKey('${w.id}','${date}')" title="${done?'İşareti kaldır':'Yapıldı olarak işaretle'}">${done?'✓':'○'}</button>
      <b>🏋️ ${esc(w.title)}${done?' ✓':''}</b>
      <span class="cal-hours">${fmtClock(w.time)}–${fmtClock(w.time+dur)}</span>
    </div>`;
  }).join('');
  return cls + wos;
}
function refreshCal(){
  document.querySelectorAll('.cal-col').forEach(c=>{ c.innerHTML = calColInner(+c.dataset.day); });
}

      </div>
    </div>
    <div class="cal-side card">
      <h3>Öğrenciler</h3>
      <div class="hint">Bir öğrenciyi takvime sürükleyip bırak: ders kaydı otomatik oluşur, ücret saat ücretinden hesaplanır. Bloğu taşı, alt kenarından uzat, düzenlemek için çift tıkla.${studentMode?'':' Kesikli çerçeveli 🎓/🏋️ blokları ile üstteki Ajanda şeridi senin kişisel programındır; Öğrenci Modunda tamamen gizlenir.'}</div>
      ${state.students.length ? state.students.map(s=>`
      <div class="cal-chip" draggable="true" ondragstart="calChipDrag(event,'${s.id}')" style="border-left:4px solid ${avatarColor(s.id)}">
        ${esc(s.name)}<span>${weekHours(s.id)} sa/hf</span>
      </div>`).join('') : '<p style="font-size:.82rem;color:var(--muted)">Önce Öğrenciler sekmesinden öğrenci ekle.</p>'}
    </div>
  </div>`;
}
function calChipDrag(ev, sid){ ev.dataTransfer.setData('text/plain', sid); }
function calDrop(ev, di){
  ev.preventDefault();
  const sid = ev.dataTransfer.getData('text/plain');
  const s = student(sid); if(!s) return;
  const rect = ev.currentTarget.getBoundingClientRect();
  let start = CAL_START + Math.floor((ev.clientY - rect.top) / CAL_SLOT_H) * CAL_SLOT;
  start = Math.max(CAL_START, Math.min(CAL_END - 90, start));
  const hours = 1.5;
  state.lessons.push({
    id: uid(), sid, date: calWeekDates()[di], subject: lastSubject(sid),
    hours, fee: Math.round(hours * (+s.rate||0)), topic: '', start
  });
  save(); render();
  toast(`${s.name} · ${fmtClock(start)} · ders kaydı oluşturuldu`);
}
/* Süre değişince ücreti (ve varsa bağlı ödemeyi) güncelle */
function calApplyDur(l, dur){
  l.hours = Math.round(dur/CAL_SLOT) * CAL_SLOT / 60;
  const s = student(l.sid);
  l.fee = Math.round(l.hours * (s ? (+s.rate||0) : 0));
  if(l.paid){
    const p = state.payments.find(p=>p.lessonId===l.id);
    if(p) p.amount = l.fee;
  }
}
let calDrag = null;
function calMoveStart(ev, id){
  ev.preventDefault();
  const l = state.lessons.find(x=>x.id===id); if(!l) return;
  calDrag = {mode:'move', id, y0:ev.clientY, orig:{start:l.start, date:l.date, dur:lessonDur(l)}};
  document.addEventListener('pointermove', calPointerMove);
  document.addEventListener('pointerup', calPointerUp);
}
function calResizeStart(ev, id){
  ev.preventDefault(); ev.stopPropagation();
  const l = state.lessons.find(x=>x.id===id); if(!l) return;
  calDrag = {mode:'resize', id, y0:ev.clientY, orig:{start:l.start, date:l.date, dur:lessonDur(l)}};
  document.addEventListener('pointermove', calPointerMove);
  document.addEventListener('pointerup', calPointerUp);
}
function calPointerMove(ev){
  if(!calDrag) return;
  const l = state.lessons.find(x=>x.id===calDrag.id); if(!l) return;
  const dSlot = Math.round((ev.clientY - calDrag.y0) / CAL_SLOT_H);
  if(calDrag.mode==='resize'){
    const dur = Math.max(CAL_SLOT, Math.min(CAL_END - l.start, calDrag.orig.dur + dSlot*CAL_SLOT));
    calApplyDur(l, dur);
  } else {
    let ns = calDrag.orig.start + dSlot*CAL_SLOT;
    l.start = Math.max(CAL_START, Math.min(CAL_END - lessonDur(l), ns));
    const el = document.elementFromPoint(ev.clientX, ev.clientY);
    const col = el && el.closest ? el.closest('.cal-col') : null;
    if(col) l.date = calWeekDates()[+col.dataset.day];
  }
  refreshCal();
}
function calPointerUp(){
  document.removeEventListener('pointermove', calPointerMove);
  document.removeEventListener('pointerup', calPointerUp);
  if(calDrag){ calDrag = null; save(); render(); }
}

/* ================= ÖDEME PLANIM (kişisel — öğrenci modunda gizli) ================= */
function billsForMonth(ym){
  return state.bills.map(b=>{
    if(b.repeat==='tek'){
      if((b.date||'').slice(0,7)!==ym) return null;
      return {b, day:+b.date.slice(8)};
    }
    const dim = new Date(+ym.slice(0,4), +ym.slice(5,7), 0).getDate();
    return {b, day: Math.min(+b.day||1, dim)};
  }).filter(Boolean);
}
function billMonthKey(b){
  return b.repeat==='tek' ? (b.date||'').slice(0,7) : new Date().toISOString().slice(0,7);
}
function isBillPaid(b, key){ return (b.paidMonths||[]).includes(key || billMonthKey(b)); }
function toggleBillPaidKey(id, key){
  const b = state.bills.find(x=>x.id===id); if(!b) return;
  b.paidMonths = b.paidMonths || [];
  const i = b.paidMonths.indexOf(key);
  if(i>=0){ b.paidMonths.splice(i,1); toast('Ödenmedi olarak işaretlendi'); }
  else { b.paidMonths.push(key); toast('Ödendi olarak işaretlendi'); }
  save(); render();
}
function toggleBillPaid(id){
  const b = state.bills.find(x=>x.id===id); if(!b) return;
  toggleBillPaidKey(id, billMonthKey(b));
}
function billDueText(b){
  return b.repeat==='tek' ? fmtDate(b.date) : `Her ayın ${+b.day||1}'i`;
}
function billStatusBtn(b){
  const paid = isBillPaid(b);
  if(paid) return `<button class="pay-btn pay-yes" onclick="toggleBillPaid('${b.id}')" title="Geri almak için tıkla">Ödendi ✓</button>`;
  const ymNow = new Date().toISOString().slice(0,7);
  const td = new Date().getDate();
  let overdue = false;
  if(b.repeat==='tek') overdue = (b.date||'') < today();
  else overdue = true && +b.day < td;

/* ================= TAKVİM ÖDEME ENTEGRASYONU ================= */
/* Fatura ve abonelik yenilemeleri Haftalık Takvim'in üst şeridinde gösterilir.
   Öğrenci Modu açıkken bu şerit hiç oluşturulmaz. */
function clampDay(day, ym){
  const dim = new Date(+ym.slice(0,4), +ym.slice(5,7), 0).getDate();
  return Math.min(+day||1, dim);
}
function calDueForDate(ds){
  const ym = ds.slice(0,7), dd = +ds.slice(8);
  const items = [];
  state.bills.forEach(b=>{
    if(b.repeat==='tek'){ if(b.date===ds) items.push({kind:'bill', b}); }
    else if(clampDay(b.day, ym)===dd) items.push({kind:'bill', b});
  });
  state.subs.forEach(s=>{
    if(s.period==='yillik'){ if((s.date||'').slice(5)===ds.slice(5)) items.push({kind:'sub', s}); }
    else if(clampDay(s.day, ym)===dd) items.push({kind:'sub', s});
  });
  return items;
}
function calDueChip(it, ds){
  const ym = ds.slice(0,7);
  if(it.kind==='bill'){
    const paid = isBillPaid(it.b, ym);
    const late = !paid && ds < today();
    const cls = paid ? ' paid' : late ? ' late' : '';
    return `<button class="bill-chip${cls}" onclick="toggleBillPaidKey('${it.b.id}','${ym}')"
      title="${esc(it.b.title)}${it.b.amount!=null?' · '+fmtTL(it.b.amount):''} — ${paid?'ödendi, geri almak için tıkla':'ödendi olarak işaretlemek için tıkla'}">
      💳 ${esc(it.b.title)}${it.b.amount!=null?' · '+fmtTL(it.b.amount):''}${paid?' ✓':''}</button>`;
  }
  return `<button class="bill-chip sub" onclick="go('bills');setBillsTab('abonelik')"
    title="Abonelik yenilemesi — Aboneliklerim'e git">🔁 ${esc(it.s.name)}${it.s.amount!=null?' · '+fmtTL(it.s.amount):''}</button>`;
}
function calDueRow(dates, todayStr){
  const perDay = dates.map(calAgendaForDate);
  if(!perDay.some(a=>a.length)) return '';
  return `<div class="cal-allday-label">Ajanda</div>` + perDay.map((a,di)=>`
    <div class="cal-allday" ${dates[di]===todayStr?'style="background:var(--row-hover)"':''}>${a.join('')}</div>`).join('');
}
/* Bir günün ajanda etiketleri: ödemeler ve saatsiz antrenmanlar (kişisel — Öğrenci Modunda gizli),
   ödev teslimleri ve denemeler (herkese görünür) */
function calAgendaForDate(ds){
  const chips = [];
  if(!studentMode){
    calDueForDate(ds).forEach(it=>chips.push(calDueChip(it, ds)));
    state.reminders.filter(r=>remOccursOn(r, ds)).forEach(r=>chips.push(reminderChip(r, ds)));
    const di = (new Date(ds+'T12:00').getDay()+6)%7;
    state.workouts.filter(w=>w.day===di && w.time==null).forEach(w=>{
      const done = (w.doneDates||[]).includes(ds);
      chips.push(`<button class="bill-chip ${done?'paid':'wo'}" onclick="toggleWorkoutDoneKey('${w.id}','${ds}')"
        title="${esc(w.title)} — ${done?'işareti kaldırmak':'yapıldı işaretlemek'} için tıkla">🏋️ ${esc(w.title)}${done?' ✓':''}</button>`);
    });
  }

/* Ders Programım, Spor Programım ve Okuma Listem yalnızca sana özeldir;

const WD_LONG = ['Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi','Pazar'];
const todayIdx = () => (new Date().getDay()+6)%7; // 0 = Pazartesi
function thisWeekDate(day){
  const d = new Date();
  d.setDate(d.getDate() - ((d.getDay()+6)%7) + day);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function daySelect(id, sel){
  return `<select id="${id}">${WD_LONG.map((n,i)=>`<option value="${i}" ${i===sel?'selected':''}>${n}</option>`).join('')}</select>`;
}

/* ---------- DERS PROGRAMIM (kendi üniversite programın) ---------- */
const MC_START = 8*60, MC_END = 21*60;
const mcY = m => (m - MC_START) / CAL_SLOT * CAL_SLOT_H;
function mcColor(code){
  let h = 0; const s = String(code||'');
  for(let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) >>> 0;
  return AVATAR_COLORS[h % AVATAR_COLORS.length];
}
/* --- Ders tanımı ve blok yardımcıları --- */
function mcCourse(c){ return (state.myCourses||[]).find(x=>x.id===c.cid) || null; }
function mcCode(c){ const k = mcCourse(c); return k ? k.code : (c.code||''); }
function mcName(c){ const k = mcCourse(c); return k ? (k.name||'') : (c.name||''); }
function mcRoom(c){ const k = mcCourse(c); return c.room || (k ? (k.room||'') : ''); }
function mcCourseHours(cid){ return state.myClasses.filter(b=>b.cid===cid).reduce((t,b)=>t+(+b.dur||0),0)/60; }

      ${kurslar.length ? kurslar.map(k=>`

        <span style="display:flex;align-items:center;gap:4px;white-space:nowrap">${mcCourseHours(k.id).toLocaleString('tr-TR')} sa

function mcColInner(di){
  return state.myClasses.filter(c=>c.day===di).map(c=>{
    const dur = +c.dur||60, oda = mcRoom(c);
    return `<div class="cal-block" data-id="${c.id}" style="top:${mcY(c.start)}px;height:${dur/CAL_SLOT*CAL_SLOT_H-2}px;background:${mcColor(mcCode(c))}"
      onpointerdown="mcMoveStart(event,'${c.id}')" ondblclick="openMyBlockForm('${c.id}')" title="${esc(mcCode(c))} · ${fmtClock(c.start)}–${fmtClock(c.start+dur)}${oda?' · '+esc(oda):''} — düzenlemek için çift tıkla">
      <button class="cal-x" onpointerdown="event.stopPropagation()" onclick="mcDelBlock('${c.id}')" title="Bu bloğu sil">×</button>
      <b>${esc(mcCode(c))}</b>
      <span class="cal-hours">${fmtClock(c.start)}–${fmtClock(c.start+dur)}${oda?' · '+esc(oda):''}</span>
      <div class="cal-resize" onpointerdown="mcResizeStart(event,'${c.id}')"></div>
    </div>`;
  }).join('');
}
function mcRefresh(){
  let lines = '';
  for(let m=MC_START+CAL_SLOT; m<MC_END; m+=CAL_SLOT)
    lines += `<div class="cal-line${m%60?' half':''}" style="top:${mcY(m)}px"></div>`;
  document.querySelectorAll('.mc-col').forEach(c=>{ c.innerHTML = lines + mcColInner(+c.dataset.day); });
}
/* --- Sürükle bırak --- */
function mcChipDrag(ev, cid){ ev.dataTransfer.setData('text/plain', cid); }
function mcDrop(ev, di){
  ev.preventDefault();
  const cid = ev.dataTransfer.getData('text/plain');
  const k = (state.myCourses||[]).find(x=>x.id===cid); if(!k) return;
  const rect = ev.currentTarget.getBoundingClientRect();
  const dur = +k.dur || 60;
  let start = MC_START + Math.floor((ev.clientY - rect.top) / CAL_SLOT_H) * CAL_SLOT;
  start = Math.max(MC_START, Math.min(MC_END - dur, start));
  state.myClasses.push({id:uid(), cid, day:di, start, dur});
  save(); render();
  toast(`${k.code} · ${WD_LONG[di]} ${fmtClock(start)} eklendi`);
}
let mcDrag = null, _mcJustDragged = false;
/* Boş alana tıklama: telefonda ve sürüklemek istemediğinde blok ekler */
function mcColClick(ev, di){
  if(_mcJustDragged) return;
  if(ev.target.closest && ev.target.closest('.cal-block')) return;
  if(!(state.myCourses||[]).length){ openMyCourseForm(); return; }
  const rect = ev.currentTarget.getBoundingClientRect();
  let start = MC_START + Math.floor((ev.clientY - rect.top) / CAL_SLOT_H) * CAL_SLOT;
  start = Math.max(MC_START, Math.min(MC_END - 60, start));
  openMyBlockForm(null, di, start);
}
function mcMoveStart(ev, id){
  ev.preventDefault();
  const b = state.myClasses.find(x=>x.id===id); if(!b) return;
  mcDrag = {mode:'move', id, y0:ev.clientY, orig:{start:b.start, day:b.day, dur:+b.dur||60}};
  document.addEventListener('pointermove', mcPointerMove);
  document.addEventListener('pointerup', mcPointerUp);
}
function mcResizeStart(ev, id){
  ev.preventDefault(); ev.stopPropagation();
  const b = state.myClasses.find(x=>x.id===id); if(!b) return;
  mcDrag = {mode:'resize', id, y0:ev.clientY, orig:{start:b.start, day:b.day, dur:+b.dur||60}};
  document.addEventListener('pointermove', mcPointerMove);
  document.addEventListener('pointerup', mcPointerUp);
}
function mcPointerMove(ev){
  if(!mcDrag) return;
  const b = state.myClasses.find(x=>x.id===mcDrag.id); if(!b) return;
  const dSlot = Math.round((ev.clientY - mcDrag.y0) / CAL_SLOT_H);
  if(mcDrag.mode==='resize'){
    b.dur = Math.max(CAL_SLOT, Math.min(MC_END - b.start, mcDrag.orig.dur + dSlot*CAL_SLOT));
  } else {
    const ns = mcDrag.orig.start + dSlot*CAL_SLOT;
    b.start = Math.max(MC_START, Math.min(MC_END - (+b.dur||60), ns));
    const el = document.elementFromPoint(ev.clientX, ev.clientY);
    const col = el && el.closest ? el.closest('.mc-col') : null;
    if(col) b.day = +col.dataset.day;
  }
  mcRefresh();
}
function mcPointerUp(){
  document.removeEventListener('pointermove', mcPointerMove);
  document.removeEventListener('pointerup', mcPointerUp);
  if(mcDrag){ mcDrag = null; _mcJustDragged = true; setTimeout(()=>{ _mcJustDragged = false; }, 250); save(); render(); }
}
function mcDelBlock(id){
  const b = state.myClasses.find(x=>x.id===id); if(!b) return;
  state.myClasses = state.myClasses.filter(x=>x.id!==id);
  save(); render(); toast('Blok kaldırıldı');
}
function mcTimeOptions(sel){
  let o = '';
  for(let m=MC_START; m<=MC_END-30; m+=30) o += `<option value="${m}" ${m===sel?'selected':''}>${fmtClock(m)}</option>`;
  return o;
}

  else { state.myCourses.push({id:uid(), ...data}); toast('Ders tanımlandı — şimdi takvime sürükle'); }

function delMyCourse(id){
  const blok = state.myClasses.filter(b=>b.cid===id).length;

  state.myCourses = (state.myCourses||[]).filter(x=>x.id!==id);
  state.myClasses = state.myClasses.filter(b=>b.cid!==id);
  save(); closeModal(); render(); toast('Ders silindi');

/* ================= ERKEN UYARI =================
   Mevcut kayıtlardan üretilir: ödev oranı, çalışma kaydı, deneme trendi,
   ders arası ve ödeme gecikmesi. Öğrenci Modunda hiç oluşturulmaz. */
const daysDiff = (a, b) => Math.round((new Date(b+'T12:00') - new Date(a+'T12:00')) / 864e5);
function studentAlerts(sid){
  const out = [], t = today();
  // 1. Son 1 haftada teslim tarihi geçmiş ödevlerin yarısından azı yapıldıysa
  const due = state.homeworks.filter(h=>h.sid===sid && h.due && h.due<=t && h.due>=shiftDate(t,-7));
  if(due.length){
    const ok = due.filter(h=>h.status==='yapildi').length;
    if(ok / due.length < 0.5)
      out.push({lvl:2, t:`Ödevlerin ${ok}/${due.length} tanesi yapıldı`, d:`son 1 haftada teslim tarihi geçen ödevler`});
  }
  // 2. Çalışma kaydı duraklamış (daha önce kayıt girmiş öğrenciler için)
  const st = (state.studies||[]).filter(x=>x.sid===sid && x.date);
  if(st.length){
    const son = st.map(x=>x.date).sort().pop();
    const g = daysDiff(son, t);
    if(g >= 4) out.push({lvl:1, t:`${g} gündür çalışma kaydı yok`, d:`son kayıt ${fmtDate(son)}`});
  }
  // 3. Deneme netleri geriliyor (aynı tür denemeler karşılaştırılır)
  const ex = state.exams.filter(e=>e.sid===sid && e.kind!=='brans' && e.date).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  if(ex.length){
    const tur = ex[ex.length-1].type;
    const ayni = ex.filter(e=>e.type===tur);
    if(ayni.length >= 3){
      const son = +ayni[ayni.length-1].net || 0;
      const onceki = ((+ayni[ayni.length-2].net||0) + (+ayni[ayni.length-3].net||0)) / 2;
      if(onceki > 0 && son < onceki * 0.9)
        out.push({lvl:2, t:`${tur} netleri düşüyor`, d:`önceki ortalama ${onceki.toFixed(1)} → son deneme ${son.toFixed(1)} net`});
    }
  }
  // 4. Ders arası uzadı ve ileri tarihli ders yok
  const ls = state.lessons.filter(l=>l.sid===sid && isActive(l));
  const gecmis = ls.filter(l=>l.date<=t).map(l=>l.date).sort();
  if(gecmis.length && !ls.some(l=>l.date>t)){
    const g = daysDiff(gecmis[gecmis.length-1], t);
    if(g >= 14) out.push({lvl:2, t:`${g} gündür ders işlenmedi`, d:'ileri tarihli ders de planlanmamış'});
  }
  // 5. Ödeme gecikmesi
  const un = unpaidLessons(sid);
  if(un.length){
    const g = daysDiff(un[0].date, t);
    if(g >= 21) out.push({lvl:2, t:`${fmtTL(debt(sid))} ödeme bekliyor`, d:`en eski ödenmemiş ders ${g} gün önce`});
  }
  return out;
}

  if(studentMode || !state.students.length) return '';
  const rows = state.students.map(s=>({s, a:studentAlerts(s.id)})).filter(x=>x.a.length)

      return (h(b)-h(a)) || (b.a.length-a.a.length);
