/* ================= ÖĞRENCİ PROGRAMI (haftalık çalışma planı) =================
   state.plans: öğrenciye özel, her hafta tekrarlayan çalışma blokları {id, sid, day, start, dur, subject, topic, note}.
   Senin ders kayıtların o haftanın programında KİLİTLİ blok olarak görünür (öğrenci değiştiremez).
   Öğrenci kendi sayfasından blok ekler / düzenler / siler; girdileri tik belgesindeki "plan" alanından gelir
   (anahtar = planKey). Kim en son değiştirdiyse onun hali geçerlidir. */
const PLAN_SUBJECTS = ['Matematik','Geometri','Fizik','Kimya','Biyoloji','Türkçe'];
const PL_START = 6*60, PL_END = 24*60;
const PLAN_DURS = [30,45,60,75,90,120,150,180,240];
const plY = m => (m - PL_START) / CAL_SLOT * CAL_SLOT_H;
const planKey = p => p.srcId || p.id;
function plansOf(sid){ return (state.plans||[]).filter(p=>p.sid===sid); }
function subjectColor(n){ const x = SUBJECTS.find(s=>s.n===n); return x ? x.fg : 'var(--accent)'; }
function weekDates(off){
  const d = new Date(); d.setDate(d.getDate() - ((d.getDay()+6)%7) + off*7);
  return [...Array(7)].map((_,i)=>{ const x = new Date(d); x.setDate(d.getDate()+i); return localDate(x); });
}
const fmtDur = m => { const h = Math.floor(m/60), r = m%60; return h ? `${h} sa${r?' '+r+' dk':''}` : `${r} dk`; };
/* Aynı gündeki çakışan blokları yan yana diz */
function layoutLanes(items){
  items.sort((a,b)=>a.start-b.start || b.end-a.end);
  const out = []; let cluster = [], clusterEnd = -1;
  const flush = () => {
    const lanes = [];
    cluster.forEach(it=>{ let i = lanes.findIndex(e=>e<=it.start); if(i<0){ i = lanes.length; lanes.push(0); } lanes[i] = it.end; it.lane = i; });
    cluster.forEach(it=>{ it.lanes = lanes.length; out.push(it); });
    cluster = [];
  };
  items.forEach(it=>{ if(cluster.length && it.start >= clusterEnd) flush(); cluster.push(it); clusterEnd = cluster.length===1 ? it.end : Math.max(clusterEnd, it.end); });
  if(cluster.length) flush();
  return out;
}
function setPlanWeek(n){ route.planWeek = n===0 ? 0 : (route.planWeek||0) + n; render(); }
function studentProgramTab(s){
  const off = route.planWeek || 0, days = weekDates(off), td = today();
  const plans = plansOf(s.id);
  const lessons = state.lessons.filter(l=>l.sid===s.id && isActive(l) && l.date>=days[0] && l.date<=days[6]);
  let lines = '';
  for(let m=PL_START+CAL_SLOT; m<PL_END; m+=CAL_SLOT) lines += `<div class="cal-line${m%60?' half':''}" style="top:${plY(m)}px"></div>`;
  let times = '';
  for(let m=PL_START; m<PL_END; m+=60) times += `<div class="cal-time" style="top:${plY(m)}px">${fmtClock(m)}</div>`;
  const colH = plY(PL_END);
  const cols = days.map((ds,di)=>{
    const items = [
      ...lessons.filter(l=>l.date===ds).map(l=>{ const st = l.start!=null ? +l.start : 18*60; return {kind:'lesson', l, start:st, end:st+Math.round((+l.hours||1)*60)}; }),
      ...plans.filter(p=>+p.day===di).map(p=>({kind:'plan', p, start:+p.start, end:+p.start+(+p.dur||60)})),
    ];
    const blocks = layoutLanes(items).map(it=>{
      const a = Math.max(PL_START, it.start), b = Math.min(PL_END, it.end);
      const pos = `top:${plY(a)}px;height:${Math.max(18, (b-a)/CAL_SLOT*CAL_SLOT_H-2)}px;left:calc(${it.lane*100/it.lanes}% + 2px);width:calc(${100/it.lanes}% - 4px);right:auto`;
      const saat = `${fmtClock(it.start)}–${fmtClock(it.end)}`;
      if(it.kind==='lesson'){
        const l = it.l;
        return `<div class="cal-block plan-lesson" style="${pos}" onclick="event.stopPropagation();openLessonForm('${l.id}')"
          title="Özel ders · ${esc(l.subject)} · ${saat}${l.topic?' · '+esc(l.topic):''} — öğrencinin programında kilitli; düzenlemek için tıkla">
          <b>🔒 ${esc(l.subject)}</b><span class="cal-hours">${saat}</span>${l.topic?`<span class="plan-topic">${esc(l.topic)}</span>`:''}</div>`;
      }
      const p = it.p;
      return `<div class="cal-block plan-block" style="${pos};background:${subjectColor(p.subject)}" onclick="event.stopPropagation();openPlanForm('${p.id}')"
        title="${esc(p.subject)} · ${saat}${p.topic?' · '+esc(p.topic):''}${p.byStudent?' · öğrenci düzenledi':''}">
        <b>${esc(p.subject)}${p.byStudent?' 👤':''}</b><span class="cal-hours">${saat}</span>${p.topic?`<span class="plan-topic">${esc(p.topic)}</span>`:''}</div>`;
    }).join('');
    return `<div class="cal-col plan-col" style="height:${colH}px;cursor:copy" onclick="planColClick(event,'${s.id}',${di})">${lines}${blocks}</div>`;
  }).join('');
  const heads = days.map((ds,di)=>`<div class="cal-dayhead" ${ds===td?'style="color:var(--accent)"':''}>${CAL_DAYS[di]}<span class="plan-daynum">${+ds.slice(8)}</span></div>`).join('');
  const planMin = plans.reduce((t,p)=>t+(+p.dur||0),0);
  const lesMin = lessons.reduce((t,l)=>t+Math.round((+l.hours||0)*60),0);
  const bySub = {}; plans.forEach(p=>{ bySub[p.subject] = (bySub[p.subject]||0) + (+p.dur||0); });
  const mon = new Date(days[0]+'T12:00'), sun = new Date(days[6]+'T12:00');
  const range = `${mon.toLocaleDateString('tr-TR',{day:'numeric',month:'short'})} – ${sun.toLocaleDateString('tr-TR',{day:'numeric',month:'short'})}`;
  return `
  <div class="toolbar">
    <button class="btn btn-primary btn-sm" onclick="openPlanForm(null,'${s.id}')">＋ Çalışma Ekle</button>
    <button class="btn btn-ghost btn-sm" onclick="setPlanWeek(-1)">‹</button>
    <button class="btn ${off===0?'btn-primary':'btn-ghost'} btn-sm" onclick="setPlanWeek(0)">Bu Hafta</button>
    <button class="btn btn-ghost btn-sm" onclick="setPlanWeek(1)">›</button>
    <span style="font-size:.84rem;color:var(--muted)">${range}</span>
  </div>
  <div class="plan-summary">
    <span class="chip badge-zero">Çalışma planı · haftada ${fmtDur(planMin)}</span>
    <span class="chip plan-lock-chip">🔒 Seninle ders · bu hafta ${fmtDur(lesMin)}</span>
    ${Object.entries(bySub).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<span class="chip" style="background:${(SUBJECTS.find(x=>x.n===k)||{}).bg||'var(--accent-soft)'};color:${subjectColor(k)}">${esc(k)} · ${fmtDur(v)}</span>`).join('')}
  </div>
  <div class="card cal-card">
    <div class="cal-grid">
      <div></div>${heads}
      <div class="cal-timecol" style="height:${colH}px">${times}</div>
      ${cols}
    </div>
  </div>
  <p class="hint-text" style="margin-top:10px">Çalışma blokları her hafta tekrarlar; boş bir alana tıklayarak ekle, bloğa tıklayarak konusunu ve saatini düzenle. 🔒 taralı bloklar senin ders kayıtların: öğrencinin programında kilitli durur, burada tıklayınca ders kaydı açılır. 👤 işaretli blokları öğrenci ekledi ya da en son öğrenci düzenledi. Öğrenci aynı programı kendi sayfasında görür ve kendi çalışmalarını ekleyebilir.</p>`;
}
function planColClick(ev, sid, di){
  if(ev.target.closest && ev.target.closest('.cal-block')) return;
  const rect = ev.currentTarget.getBoundingClientRect();
  let start = PL_START + Math.floor((ev.clientY - rect.top) / CAL_SLOT_H) * CAL_SLOT;
  start = Math.max(PL_START, Math.min(PL_END - 60, start));
  openPlanForm(null, sid, di, start);
}
function planTimeOptions(sel){
  let o = '';
  for(let m=PL_START; m<PL_END; m+=15) o += `<option value="${m}" ${m===sel?'selected':''}>${fmtClock(m)}</option>`;
  if(sel!=null && (sel-PL_START)%15) o = `<option value="${sel}" selected>${fmtClock(sel)}</option>` + o;
  return o;
}
function planDurOptions(sel){
  const list = PLAN_DURS.includes(sel) ? PLAN_DURS : [...PLAN_DURS, sel].sort((a,b)=>a-b);
  return list.map(m=>`<option value="${m}" ${m===sel?'selected':''}>${fmtDur(m)}</option>`).join('');
}

    <div class="field full"><label>Ne yapılacak?</label><textarea id="f_pnote" placeholder="Örn. Derste çözdüğümüz 20 soruyu tekrar et, 3D yayınları test 4">${esc(p.note||'')}</textarea></div>

    ${id?`<button class="btn btn-danger" style="margin-right:auto" onclick="delPlan('${id}')">Sil</button>`:''}

    <button class="btn btn-primary" onclick="savePlan('${id||''}','${p.sid}')">Kaydet</button>
  </div>`);

function planTopicList(){
  const dl = document.getElementById('planTopics'), sel = document.getElementById('f_psub');
  if(dl && sel) dl.innerHTML = (CURRICULUM[sel.value] ? currTopics(sel.value) : []).map(c=>`<option value="${esc(c.t)}">`).join('');
}
function savePlan(id, sid){
  const start = +fv('f_pstart');
  const dur = Math.min(+fv('f_pdur') || 60, 24*60 - start);
  const data = {day:+fv('f_pday'), start, dur, subject:fv('f_psub'), topic:fv('f_ptopic').slice(0,120), note:fv('f_pnote').slice(0,300), updatedAt:Date.now(), byStudent:false};
  state.plans = state.plans || [];
  if(id){ const p = state.plans.find(x=>x.id===id); if(!p) return; Object.assign(p, data); }
  else state.plans.push({id:uid(), sid, ...data});
  save(); closeModal(); render(); toast(id ? 'Program güncellendi' : `${WD_LONG[data.day]} ${fmtClock(start)} · ${data.subject} eklendi`);
}
function delPlan(id){
  const p = (state.plans||[]).find(x=>x.id===id); if(!p) return;
  if(!confirm('Bu çalışma bloğu öğrencinin programından da kaldırılsın mı?')) return;
  state.plans = state.plans.filter(x=>x.id!==id);
  removeStudentInput(p.sid, 'plan', planKey(p));
  save(); closeModal(); render(); toast('Blok kaldırıldı');
}
/* Öğrencinin gönderdiği program bloğunu doğrula */
function sanitizePlan(x){
  const day = Math.round(+x.day), start = Math.round(+x.start), dur = Math.round(+x.dur);
  if(!(day>=0 && day<=6) || !(start>=0 && start<24*60) || !(dur>=15 && dur<=600)) return null;
  if(!PLAN_SUBJECTS.includes(x.subject)) return null;
  return {day, start, dur:Math.min(dur, 24*60-start), subject:x.subject, topic:String(x.topic||'').slice(0,120), note:String(x.note||'').slice(0,300)};
}

/* ================= MÜFREDAT TAKİBİ =================
   Konu, derste işlendiyse otomatik (ders konusu müfredat adıyla eşleşince),
   değilse elle işaretlenir. İlerleme ikisinin birleşimidir. */
const keySlug = t => (t||'').toLowerCase()
  .replace(/ı/g,'i')
  .normalize('NFD').replace(/[\u0300-\u036f]/g,'')   // ayrık kodlanmış Türkçe harfleri de yakala
  .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
/* HTML özniteliği içine güvenli JS metin argümanı (kesme işaretli konu adları için: "Newton'un …") */
const jsArg = v => esc(JSON.stringify(String(v)));
function currKey(sub, t){ return keySlug(sub)+':'+keySlug(t); }
function currTopics(sub){
  const extra = (state.currExtra||[]).filter(x=>x.sub===sub).map(x=>({t:x.t, e:+x.e||3, own:true}));
  const hidden = state.currHidden||[];
  return (CURRICULUM[sub]||[]).concat(extra).filter(c=>!hidden.includes(currKey(sub,c.t)));
}
function currSubjects(sid){
  const used = [...new Set(state.lessons.filter(l=>l.sid===sid && l.subject && l.subject!=='Deneme').map(l=>l.subject))];
  const all = SUBJECTS.map(x=>x.n).filter(n=>n!=='Deneme');
  const rest = all.filter(n=>!used.includes(n));
  return used.concat(rest);
}
const normTopic = t => keySlug(t).replace(/-/g,' ');
/* Ders konularından otomatik eşleşen müfredat konuları: {anahtar: son işlendiği tarih} */
function autoCovered(sid, sub){
  const out = {}, tops = currTopics(sub);
  state.lessons.filter(l=>l.sid===sid && l.subject===sub && l.topic && isActive(l) && l.date<=today()).forEach(l=>{
    const lt = normTopic(l.topic);
    if(lt.length < 4) return;
    tops.forEach(c=>{
      const ct = normTopic(c.t);
      if(ct.length < 5) return;
      if(lt.includes(ct) || (ct.includes(lt) && lt.length >= 6)){
        const k = currKey(sub, c.t);
        if(!out[k] || out[k] < l.date) out[k] = l.date;
      }
    });
  });
  return out;
}
function currStats(s, sub, lvl){
  const auto = autoCovered(s.id, sub), man = s.curr || {};
  const list = currTopics(sub).filter(c => !lvl || (c.e & lvl));
  const done = list.filter(c => { const k = currKey(sub,c.t); return man[k] || auto[k]; }).length;
  return {done, total:list.length, pct: list.length ? Math.round(done/list.length*100) : 0};
}
function toggleCurr(sid, sub, t){
  const s = state.students.find(x=>x.id===sid); if(!s) return;
  s.curr = s.curr || {};
  const k = currKey(sub, t);
  if(s.curr[k]) delete s.curr[k]; else s.curr[k] = today();
  save(); render();
}
function setCurrSub(v){ route.curSub = v; render(); }
function setCurrLvl(v){ route.curLvl = +v; render(); }
function hideCurrTopic(sub, t){
  if(!confirm(`"${t}" konusu tüm öğrenciler için listeden gizlensin mi?`)) return;
  state.currHidden = state.currHidden || [];
  state.currHidden.push(currKey(sub, t)); save(); render(); toast('Konu gizlendi');
}
function showHiddenTopics(sub){
  const pre = keySlug(sub)+':';
  state.currHidden = (state.currHidden||[]).filter(k=>!k.startsWith(pre));
  save(); render(); toast('Gizlenen konular geri getirildi');
}
function openCurrAddForm(sub){

function currBar(pct, col){
  return `<div style="height:7px;border-radius:5px;background:var(--line);overflow:hidden">
    <i style="display:block;height:100%;width:${Math.max(2,pct)}%;background:${col}"></i></div>`;

function curriculumTab(s){
  const subs = currSubjects(s.id);

  const tops = currTopics(sub);
  if(!tops.length) return `<div class="card">${emptyState('📘','Bu ders için müfredat listesi yok','Kendi konularını ekleyerek bu dersin takibini başlatabilirsin.')}

  const auto = autoCovered(s.id, sub), man = s.curr || {};

  return `

      <div><div class="lbl">AYT <b>%${ayt.pct}</b> <span>${ayt.done}/${ayt.total}</span></div>${currBar(ayt.pct,'var(--violet)')}</div>

    <p class="hint-text" style="margin-top:12px">Ders kaydında konu olarak müfredat başlığını seçersen buraya otomatik işlenir. Elle işaret koymak için kutucuğu kullan.</p>

function setRepMonth(v){ if(v) route.repMonth = v; render(); }

  s.repNotes = s.repNotes || {};
  if(v.trim()) s.repNotes[ym] = v.trim(); else delete s.repNotes[ym];

function reportData(s, ym){
  const t = today();
  const ls = state.lessons.filter(l=>l.sid===s.id && (l.date||'').startsWith(ym) && isActive(l) && l.date<=t)
    .sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const saat = ls.reduce((x,l)=>x+(+l.hours||0),0);
  const dersDagilim = {};
  ls.forEach(l=>{ dersDagilim[l.subject] = (dersDagilim[l.subject]||0) + (+l.hours||0); });
  const konular = [];
  ls.forEach(l=>{ if(l.topic && !konular.some(k=>k.t===l.topic)) konular.push({t:l.topic, sub:l.subject, d:l.date}); });
  const hw = state.homeworks.filter(h=>h.sid===s.id && (h.due||'').startsWith(ym));
  const hwOk = hw.filter(h=>h.status==='yapildi').length;
  const ex = state.exams.filter(e=>e.sid===s.id && (e.date||'').startsWith(ym)).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const oncekiYm = (()=>{ const d = new Date(ym+'-01T12:00'); d.setMonth(d.getMonth()-1); return d.toISOString().slice(0,7); })();
  const exOnce = state.exams.filter(e=>e.sid===s.id && (e.date||'').startsWith(oncekiYm) && e.kind!=='brans');
  const ort = list => list.length ? list.reduce((x,e)=>x+(+e.net||0),0)/list.length : null;
  const st = (state.studies||[]).filter(x=>x.sid===s.id && (x.date||'').startsWith(ym));
  const stSaat = st.reduce((x,y)=>x+(+y.hours||0),0);
  const stDagilim = {};
  st.forEach(x=>{ stDagilim[x.subject] = (stDagilim[x.subject]||0) + (+x.hours||0); });
  const dersler = [...new Set(ls.map(l=>l.subject))].filter(x=>x && x!=='Deneme' && CURRICULUM[x]);
  const muf = dersler.map(sub=>({sub, tyt:currStats(s,sub,1), ayt:currStats(s,sub,2)}));
  return {ls, saat, dersDagilim, konular, hw, hwOk, ex, exOrt:ort(ex.filter(e=>e.kind!=='brans')), exOnceOrt:ort(exOnce),
    st, stSaat, stDagilim, muf, oncekiYm};
}

  return L.join('\n');
}

/* ---------- HATIRLATMA & NOTLAR (kişisel — öğrenci modunda gizli) ---------- */
/* Genel Bakış üst uyarısı: geciken, bugünkü ve yarınki açık hatırlatmalar. Öğrenci Modunda hiç oluşturulmaz. */
function dashboardReminderAlert(){
  if(studentMode) return '';
  const t = today();
  const tm = new Date(); tm.setDate(tm.getDate()+1);
  const tomorrow = localDate(tm);
  const list = state.reminders.map(r=>({r, date:remWhenDate(r)})).filter(x=>x.date && x.date<=tomorrow)
    .sort((a,b)=>a.date.localeCompare(b.date) || (a.r.time||'').localeCompare(b.r.time||''));
  if(!list.length) return '';
  const urgent = list.some(x=>x.date<=t);
  const nToday = list.filter(x=>x.date===t).length, nLate = list.filter(x=>x.date<t).length, nTom = list.length-nToday-nLate;
  const parts = [];
  if(nLate) parts.push(`${nLate} gecikmiş`); if(nToday) parts.push(`${nToday} bugün`); if(nTom) parts.push(`${nTom} yarın`);
  const rows = list.map(({r, date})=>{
    const k = date<t ? 'late' : date===t ? 'today' : 'tomorrow';
    const lbl = k==='late' ? 'Gecikti · '+fmtDate(date) : k==='today' ? 'Bugün' : 'Yarın';
    return `<div class="rem-alert-row">
      <span class="when ${k}">${lbl}${r.time?' '+r.time:''}</span>
      <span class="t">${esc(r.title)}${remRepeats(r)?' 🔁':''}<span class="m" style="display:block;font-weight:500">${fmtDate(date)} ${reminderDayWeek(date)}${remRepeats(r)?' · '+esc(remLabel(r)):''}${r.note?' · '+esc(r.note):''}</span></span>
      <button class="pay-btn pay-no" onclick="toggleReminderDone('${r.id}','${date}')">Tamamla</button>
    </div>`;}).join('');
  return `
  <div class="rem-alert ${urgent?'urgent':''}" role="alert">
    <h3>🔔 Hatırlatma uyarısı <span style="font-weight:600;opacity:.8">· ${parts.join(', ')}</span>
      <button class="btn btn-ghost btn-sm" style="margin-left:auto" onclick="go('notes')">Tümü →</button></h3>
    <div class="rem-alert-list">${rows}</div>
  </div>`;
}
/* --- Tekrarlayan hatırlatmalar --- */
const REM_REPEATS = [
  {v:'tek',      t:'Tekrarlamaz'},
  {v:'gunluk',   t:'Her gün'},
  {v:'haftalik', t:'Her hafta'},
  {v:'aylik',    t:'Her ay'},
  {v:'yillik',   t:'Her yıl'},
];
const remRepeats = r => !!r.repeat && r.repeat !== 'tek';
function remLabel(r){
  switch(r.repeat){
    case 'gunluk':   return 'Her gün';
    case 'haftalik': return `Her ${WD_LONG[+r.wd||0]}`;
    case 'aylik':    return `Her ayın ${+r.day||1}. günü`;
    case 'yillik':   return `Her yıl ${new Date((r.date||today())+'T12:00').toLocaleDateString('tr-TR',{day:'numeric',month:'long'})}`;
    default:         return '';
  }
}
/* r hatırlatması ds gününe düşüyor mu? (r.date tekrarlayanlarda başlangıç tarihidir) */
function remOccursOn(r, ds){
  if(r.date && ds < r.date) return false;
  switch(r.repeat){
    case 'gunluk':   return true;
    case 'haftalik': return ((new Date(ds+'T12:00').getDay()+6)%7) === (+r.wd||0);
    case 'aylik':    return +ds.slice(8) === clampDay(+r.day||1, ds.slice(0,7));
    case 'yillik':   return !!r.date && ds.slice(5) === r.date.slice(5);
    default:         return r.date === ds;
  }
}
function remDoneOn(r, ds){ return remRepeats(r) ? (r.doneDates||[]).includes(ds) : !!r.done; }
/* Bugünden ileriye doğru ilk yapılmamış tekrar */
function remNext(r, from){
  const t = from || today();
  if(!remRepeats(r)) return (!r.done && r.date && r.date >= t) ? r.date : null;
  let d = t;
  for(let i=0; i<400; i++){
    if(remOccursOn(r,d) && !remDoneOn(r,d)) return d;
    d = shiftDate(d,1);
  }
  return null;
}
/* Yalnızca EN SON geçmiş tekrar; o yapıldıysa null döner.
   Böylece eski tekrarlar birikip kuyruk oluşturmaz: bir tekrarı işaretleyince
   daha eskileri geri gelmez, sıradaki tekrara geçilir. */
function remOverdue(r){
  const t = today();
  if(!remRepeats(r)) return (!r.done && r.date && r.date < t) ? r.date : null;
  let d = shiftDate(t,-1);
  for(let i=0; i<400; i++){
    if(r.date && d < r.date) return null;
    if(remOccursOn(r,d)) return remDoneOn(r,d) ? null : d;
    d = shiftDate(d,-1);
  }
  return null;
}
/* Listede ve uyarıda gösterilecek asıl tarih: önce gecikmiş olan, yoksa sıradaki */
function remWhenDate(r){ return remOverdue(r) || remNext(r); }
function reminderChip(r, ds){
  const done = remDoneOn(r, ds);
  return `<button class="bill-chip ${done?'paid':'rem'}" onclick="toggleReminderDone('${r.id}','${ds}')"
    title="${esc(r.title)}${remRepeats(r)?' · '+remLabel(r):''} — ${done?'işareti kaldırmak':'tamamlandı işaretlemek'} için tıkla">🔔 ${r.time?r.time+' ':''}${esc(r.title)}${remRepeats(r)?' 🔁':''}${done?' ✓':''}</button>`;
}
/* Hatırlatma tarihi: gün adı ve hafta numarası ile (0. hafta = 21 Eylül 2026 Pazartesi) */
function reminderDayWeek(ds){
  const wd = WD_LONG[(new Date(ds+'T12:00').getDay()+6)%7];
  const n = weekNo(ds);
  return wd + (n!=null ? ` · ${n}. hafta` : ' · numarasız hafta');
}
function reminderWhen(r, ds){
  const d = ds || remWhenDate(r) || r.date;
  if(!d) return 'Tarihsiz';
  const t = today();
  const rel = d===t ? 'Bugün' : d===shiftDate(t,1) ? 'Yarın' : '';  // 'Gecikti' etiketi listede ayrıca yazılır
  return (rel ? rel+' · ' : '') + fmtDate(d) + ' ' + reminderDayWeek(d) + (r.time ? ' · '+r.time : '');
}

  const data = {title, repeat, date, time:fv('f_rmtime')||null, note:fv('f_rmnote'),

/* --- Şifreleme (WebCrypto: PBKDF2 + AES-GCM) --- */
const _te = new TextEncoder();
function bufToB64(buf){
  const u = new Uint8Array(buf); let s = '';
  for(let i=0;i<u.length;i+=0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i+0x8000));
  return btoa(s);
}
const _keyCache = {};
async function deriveKey(code, salt){
  const ck = code.trim().toUpperCase() + '|' + salt;
  if(_keyCache[ck]) return _keyCache[ck];
  const base = await crypto.subtle.importKey('raw', _te.encode(code.trim().toUpperCase()), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:_te.encode(salt), iterations:120000, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
  _keyCache[ck] = key; return key;
}
async function encryptPayload(obj, code, salt){
  const key = await deriveKey(code, salt);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, _te.encode(JSON.stringify(obj)));
  return {v:1, iv:bufToB64(iv), data:bufToB64(ct)};
}
async function sha256hex(str){
  const h = await crypto.subtle.digest('SHA-256', _te.encode(str));
  return Array.from(new Uint8Array(h), b=>b.toString(16).padStart(2,'0')).join('');
}
/* Öğrencinin tik belgesi: yol yalnızca kodu bilenin hesaplayabileceği bir özet */
async function tickId(s){ return sha256hex(`tick:${s.id}:${studentCode(s).trim().toUpperCase()}`); }

const fb = {db:null, auth:null, user:null, error:'', status:'off'}; // off | signedout | syncing | ok | error
function cloudAvailable(){ return typeof firebase !== 'undefined' && !!cloudConfig().projectId; }
function cloudInit(){
  if(!cloudAvailable()){ fb.status = 'off'; fb.error = 'Firebase kütüphanesi yüklenemedi (internet?)'; updateCloudBadge(); return; }
  try{
    if(!firebase.apps.length) firebase.initializeApp(cloudConfig());
    fb.db = firebase.firestore();
    // iPhone/Safari ve bazı ağlarda sürekli akış bağlantısı kesilebiliyor → daha basit uzun sorgu bağlantısı
    try{ fb.db.settings({experimentalForceLongPolling:true, experimentalAutoDetectLongPolling:false, merge:true}); }catch(e){}
    fb.auth = firebase.auth();
    fb.auth.onAuthStateChanged(u => {
      fb.user = u;
      fb.status = u ? 'ok' : 'signedout';
      updateCloudBadge();
      if(u){ watchPanel(); scheduleSync(true); watchTicks(); }
      else { stopTicks(); stopPanel(); }
    });
  }catch(e){ fb.status = 'error'; fb.error = e.message; updateCloudBadge(); }
}
async function cloudSignIn(email, pass){
  if(!fb.auth) cloudInit();
  if(!fb.auth) throw new Error(fb.error || 'Firebase hazır değil');
  await fb.auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});
  await fb.auth.signInWithEmailAndPassword(email, pass);
}
function cloudSignOut(){ if(fb.auth) fb.auth.signOut(); }
function cloudErrText(e){
  const c = (e && e.code) || '';
  if(c.includes('invalid-credential') || c.includes('wrong-password') || c.includes('user-not-found')) return 'E-posta ya da şifre hatalı (Firebase → Authentication → Users içinde bu kullanıcı olmalı)';
  if(c.includes('operation-not-allowed')) return 'Firebase → Authentication → Sign-in method → Email/Password açık değil';
  if(c.includes('permission-denied')) return 'Firestore kuralları yazmaya izin vermiyor — Bulut penceresinden kuralları kopyalayıp Firestore → Rules\'a yapıştır';
  if(c.includes('network') || c.includes('unavailable')) return 'İnternet bağlantısı yok — değişiklikler bu cihazda bekliyor, bağlantı gelince gönderilir';
  return (e && (e.message || String(e))) || 'Bilinmeyen hata';
}

/* --- Otomatik senkron: her save() sonrası değişen öğrenciler yazılır --- */
let _syncTimer = null, _syncing = false, _syncAgain = false;
function scheduleSync(now){
  if(!fb.user) return;
  clearTimeout(_syncTimer);
  _syncTimer = setTimeout(syncNow, now ? 150 : 1200);
}
async function syncNow(){
  if(!fb.user || !fb.db) return;
  if(_syncing){ _syncAgain = true; return; }
  _syncing = true; fb.status = 'syncing'; updateCloudBadge();
  try{
    for(const s of state.students){
      const body = studentPayload(s);
      const h = await sha256hex(JSON.stringify(body) + '|' + studentCode(s));
      if(cloud.synced[s.id] === h) continue;
      const pkg = await encryptPayload({...body, publishedAt:new Date().toISOString()}, studentCode(s), s.id);
      await fb.db.collection('pages').doc(s.id).set({...pkg, updatedAt: Date.now()});
      cloud.synced[s.id] = h; saveCloud();
    }
    // Silinen öğrencilerin belgelerini kaldır
    for(const id of Object.keys(cloud.synced)){
      if(state.students.some(s=>s.id===id)) continue;
      try{ await fb.db.collection('pages').doc(id).delete(); }catch(e){}
      delete cloud.synced[id]; saveCloud();
    }
    await pushPanel();
    cloud.lastSync = Date.now(); saveCloud();
    fb.status = 'ok'; fb.error = '';
  }catch(e){
    fb.status = 'error'; fb.error = cloudErrText(e);
  }finally{
    _syncing = false; updateCloudBadge();
    if(_syncAgain){ _syncAgain = false; scheduleSync(); }
  }
}
/* Yeniden tam gönderim (ör. kurallar düzeltildikten sonra) */
function resyncAll(){ cloud.synced = {}; saveCloud(); scheduleSync(true); toast('Tüm öğrenciler yeniden gönderiliyor'); }

/* --- Öğrenci tiklerini canlı dinle --- */
const _tickUnsubs = {};
/* ---------- PANEL SENKRONU: tüm panel verisi panel/<uid> belgesinde, yalnızca öğretmen hesabı okur/yazar.
   Telefon ve bilgisayar aynı hesapla girince aynı veriyi görür; son kaydeden kazanır. ---------- */
let _panelUnsub = null, _panelSeen = false, _panelRemoteCount = 0, _panelRemoteAt = 0;
let _panelBytes = 0, _panelRaw = 0, _panelWarned = false;
let _panelPending = null;   // form açıkken gelen güncelleme burada bekler, form kapanınca uygulanır
/* Firestore belge sınırı 1.048.576 bayt; alan adları ve ek alanlar için pay bırakıyoruz. */
const PANEL_LIMIT = 1000000;
const canZip = () => typeof CompressionStream === 'function' && typeof DecompressionStream === 'function';
const FBytes = () => (typeof firebase!=='undefined' && firebase.firestore) ? (firebase.firestore.Blob || firebase.firestore.Bytes) : null;
async function deflateStr(str){
  const cs = new CompressionStream('deflate-raw');
  const w = cs.writable.getWriter(); w.write(new TextEncoder().encode(str)); w.close();
  return new Uint8Array(await new Response(cs.readable).arrayBuffer());
}
async function inflateBytes(u8){
  const ds = new DecompressionStream('deflate-raw');
  const w = ds.writable.getWriter(); w.write(u8); w.close();
  return new TextDecoder().decode(await new Response(ds.readable).arrayBuffer());
}
/* Belgeyi oku: sıkıştırılmış (gz) ya da eski düz (data) biçim */
async function panelJson(r){
  if(r.gz){
    if(!canZip()) throw new Error('Bu cihaz sıkıştırılmış veriyi açamıyor (tarayıcı eski)');
    const u8 = r.gz.toUint8Array ? r.gz.toUint8Array() : new Uint8Array(r.gz);
    return await inflateBytes(u8);
  }
  return r.data || '';
}
function panelRef(){ return fb.db.collection('panel').doc(fb.user.uid); }
/* ---------- Üç yönlü birleştirme ----------
   base: bu cihazın buluttan son aldığı/gönderdiği kopya; local: bu cihaz; remote: bulut.
   Yalnızca bir tarafta değişen alan o taraftan alınır. İki tarafta da değişen nesneler alan alan,
   id'li listeler kayıt kayıt birleştirilir; böylece telefonda ödeme alırken bilgisayarda müfredat
   işaretlemek birbirini silmez. Aynı alanı iki cihaz farklı değere çektiyse bu cihaz kazanır
   (…At / lastSeen gibi zaman alanlarında büyük olan). */
const _same = (a,b) => a === b || JSON.stringify(a) === JSON.stringify(b);
const _isObj = x => x !== null && typeof x === 'object' && !Array.isArray(x);
const _idList = a => Array.isArray(a) && a.every(x => _isObj(x) && x.id != null);
function merge3(base, local, remote, key){
  if(_same(local, remote)) return local;
  if(base !== undefined && _same(local, base)) return remote;
  if(base !== undefined && _same(remote, base)) return local;
  if(_isObj(local) && _isObj(remote)){
    const b = _isObj(base) ? base : {}, out = {};
    for(const k of new Set([...Object.keys(remote), ...Object.keys(local)])){
      const inL = k in local, inR = k in remote, inB = k in b;
      if(inL && inR){ out[k] = merge3(inB ? b[k] : undefined, local[k], remote[k], k); continue; }
      const v = inL ? local[k] : remote[k];
      if(inB && _same(b[k], v)) continue;   // öbür cihaz sildi, bu taraf dokunmadı → silinir
      out[k] = v;                            // yeni eklendi (ya da silinirken öbür tarafta değişti → korunur)
    }
    return out;
  }
  if(Array.isArray(local) && Array.isArray(remote)){
    const b = Array.isArray(base) ? base : [];
    if(_idList(local) && _idList(remote)){
      const idx = a => new Map(a.filter(x => _isObj(x) && x.id != null).map(x => [String(x.id), x]));
      const bm = idx(b), lm = idx(local), rm = idx(remote), out = [];
      for(const id of [...rm.keys(), ...[...lm.keys()].filter(id => !rm.has(id))]){
        const inL = lm.has(id), inR = rm.has(id), inB = bm.has(id);
        if(inL && inR){ out.push(merge3(inB ? bm.get(id) : undefined, lm.get(id), rm.get(id))); continue; }
        const v = inL ? lm.get(id) : rm.get(id);
        if(inB && _same(bm.get(id), v)) continue;
        out.push(v);
      }
      return out;
    }
    // id'siz listeler (gizlenen konular, eklenen müfredat konuları): küme olarak birleştir
    const s = x => JSON.stringify(x), bs = new Set(b.map(s)), ls = new Set(local.map(s)), rs = new Set(remote.map(s));
    const out = [], seen = new Set();
    for(const x of remote){ const k = s(x); if(bs.has(k) && !ls.has(k)) continue; out.push(x); seen.add(k); }
    for(const x of local){ const k = s(x); if(seen.has(k) || (bs.has(k) && !rs.has(k))) continue; out.push(x); seen.add(k); }
    return out;
  }
  if(typeof local === 'number' && typeof remote === 'number' && /(At|Seen)$/.test(key || '')) return Math.max(local, remote);
  return local;
}
const _clone = o => JSON.parse(JSON.stringify(o));

/* Ortak kopya (base) IndexedDB'de durur; localStorage'ı ikiye katlamamak için */
const SYNC_DB = 'ogrenciTakipSenkron';
function _syncDb(){
  return new Promise((res, rej) => {
    const r = indexedDB.open(SYNC_DB, 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function panelBaseGet(){
  try{
    const db = await _syncDb();
    return await new Promise(res => { const q = db.transaction('kv').objectStore('kv').get('base'); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); });
  }catch(e){ return null; }
}
async function panelBaseSet(json, at){
  try{
    const db = await _syncDb();
    await new Promise(res => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put({json, at}, 'base'); tx.oncomplete = res; tx.onerror = res; });
  }catch(e){}
}
async function panelBaseObj(){ const b = await panelBaseGet(); try{ return b ? JSON.parse(b.json) : undefined; }catch(e){ return undefined; } }
async function panelPayload(json){
  const raw = new TextEncoder().encode(json).length;
  if(canZip() && FBytes()){
    const u8 = await deflateStr(json);
    return {payload:{gz: FBytes().fromUint8Array(u8), enc:'deflate-raw'}, bytes:u8.length, raw};
  }
  return {payload:{data: json}, bytes: raw, raw};                 // eski tarayıcı: düz metin
}
function replaceLocalState(obj){ localStorage.setItem(KEY, JSON.stringify(obj)); state = load(); }
const formOpen = () => { const m = document.getElementById('modalBackdrop'); return !!(m && m.classList.contains('open')); };

let _panelWriting = 0;   // bu cihazın yazdığı sürüm; kendi yankımızı "başka cihaz" sanmamak için
async function pushPanel(force){
  if(!fb.user || !fb.db) return;
  if(!force){
    if(!_panelSeen) return;                                // uzak kopyayı görmeden yazma
    if(!panelDirty()) return;                              // gönderilmemiş değişiklik yok
    if(!stateCount() && _panelRemoteCount > 0) return;      // boş cihaz, dolu bulut kopyasını ezmesin
  }
  const seq = _saveSeq, ref = panelRef();
  let res = null;
  // İşlem (transaction): okuduğumuz bulut sürümü yazana kadar değişirse Firestore baştan çalıştırır
  await fb.db.runTransaction(async tx => {
    res = null;
    const snap = await tx.get(ref);
    const r = snap.exists ? snap.data() : null;
    const mine = _clone(state);
    let obj = mine, merged = false, remoteJson = null;
    if(!force && r && (r.data || r.gz) && r.updatedAt !== cloud.panelPushed){
      // Bulut, bizim son gördüğümüzden farklı: başka cihaz yazmış → üzerine yazma, birleştir
      if(formOpen()){ res = {deferred:true}; return; }      // form kapanınca birleştirilir
      remoteJson = await panelJson(r);
      const remote = JSON.parse(remoteJson);
      obj = merge3(await panelBaseObj(), mine, remote);
      merged = true;
      if(_same(obj, remote)){ res = {noop:true, merged, mine, obj:remote, json:remoteJson, at:r.updatedAt}; return; }
    }
    const json = JSON.stringify(obj);
    if(!force && !merged && r && r.updatedAt === cloud.panelPushed){
      const b = await panelBaseGet();
      if(b && b.json === json){ res = {noop:true, merged:false, mine, obj, json, at:r.updatedAt}; return; }  // gerçek değişiklik yok
    }
    const enc = await panelPayload(json);
    if(enc.bytes > PANEL_LIMIT){ res = {tooBig: enc.bytes}; return; }
    const at = Math.max(Date.now(), (r && r.updatedAt || 0) + 1);
    _panelWriting = at;
    tx.set(ref, {...enc.payload, raw:enc.raw, bytes:enc.bytes, count:stateCount(obj), updatedAt:at, device:navigator.userAgent.slice(0,60)});
    res = {merged, mine, obj, json, at, bytes:enc.bytes, raw:enc.raw};
  });
  if(!res || res.deferred) return;
  if(res.tooBig){
    fb.error = `Panel verisi bulut sınırını aştı (${fmtKB(res.tooBig)} / ${fmtKB(PANEL_LIMIT)}). Eski kayıtları yedekleyip temizle.`;
    fb.status = 'error'; updateCloudBadge(); toast('Bulut sınırı aşıldı — veri gönderilemedi'); return;
  }
  const quiet = seq === _saveSeq;                          // gönderim sürerken yeni kayıt yapılmadıysa
  if(res.merged){
    // Birleşik sürümü bu cihaza da uygula; bu arada girilen yeni kayıtları koru
    replaceLocalState(quiet ? res.obj : merge3(res.mine, _clone(state), res.obj));
    render(); toast(res.noop ? `Panel verisi buluttan geldi · ${stateCount()} kayıt` : 'Diğer cihazdaki değişiklikler bu cihazdakilerle birleştirildi');
  }
  cloud.panelPushed = res.at; saveCloud();
  await panelBaseSet(res.json, res.at);
  if(quiet){ clearPanelDirty(); _panelAt = res.at; localStorage.setItem(PANEL_AT_KEY, String(res.at)); }
  else scheduleSync();
  if(res.bytes){ _panelBytes = res.bytes; _panelRaw = res.raw; panelSizeWarn(); }
}
let _panelQ = Promise.resolve();
function watchPanel(){
  stopPanel();
  if(!fb.user || !fb.db) return;
  // Eski sürümden geçiş: "kirli" bayrağı yoksa zaman damgasından türet
  if(localStorage.getItem(PANEL_DIRTY_KEY) === null) localStorage.setItem(PANEL_DIRTY_KEY, _panelAt > (cloud.panelPushed||0) ? '1' : '0');
  _panelSeen = false;
  _panelUnsub = panelRef().onSnapshot(
    doc => { _panelQ = _panelQ.then(() => onPanelSnap(doc)).catch(() => {}); },
    err => { fb.error = 'Panel senkronu: ' + err.message; fb.status='error'; updateCloudBadge(); });
}
async function onPanelSnap(doc){
  _panelSeen = true;
  const r = doc.exists ? doc.data() : null;
  if(!r || (!r.data && !r.gz)){ _panelRemoteCount = 0; _panelRemoteAt = 0; _panelBytes = 0; markPanelDirty(); scheduleSync(true); return; } // bulutta panel yok
  _panelRemoteAt = r.updatedAt || 0;
  let json = '';
  try{ json = await panelJson(r); }catch(e){ fb.error = e.message; fb.status='error'; updateCloudBadge(); return; }
  _panelBytes = r.bytes || new TextEncoder().encode(json).length;
  _panelRaw = r.raw || _panelBytes;
  try{ _panelRemoteCount = r.count!=null ? r.count : stateCount(JSON.parse(json)); }catch(e){ _panelRemoteCount = 0; }
  panelSizeWarn();
  // Elimizdeki sürüm ya da kendi yazdığımızın yankısı: yeni bir şey yok
  if(r.updatedAt === cloud.panelPushed || r.updatedAt === _panelWriting){
    if(panelDirty()) scheduleSync(true);
    return;
  }
  // Başka cihazdan yeni sürüm. Form açıkken yazmakta olduğun kaydı ezmemek için beklet — ama ASLA atma.
  // Cihazda hiç kayıt yoksa (ilk bağlanış) beklemeden uygula.
  if(formOpen() && stateCount()){ _panelPending = {json, at:r.updatedAt}; return; }
  await takeRemote(json, r.updatedAt);
}
/* Buluttan gelen sürüm: bu cihazda gönderilmemiş değişiklik yoksa olduğu gibi al, varsa birleştir */
async function takeRemote(json, at){
  if(!panelDirty()) return applyPanelJson(json, at);
  let remote; try{ remote = JSON.parse(json); }catch(e){ return false; }
  if(!remote || !Array.isArray(remote.students)) return false;
  const seq = _saveSeq, mine = _clone(state);
  const merged = merge3(await panelBaseObj(), mine, remote);
  const now = seq === _saveSeq ? merged : merge3(mine, _clone(state), merged);
  if(_same(now, remote)) return applyPanelJson(json, at, true);
  replaceLocalState(now);
  cloud.panelPushed = at; saveCloud();                     // ortak kopya artık bu bulut sürümü
  await panelBaseSet(json, at);
  _panelPending = null;
  markPanelDirty(); render(); scheduleSync(true);          // birleşik hali buluta gönder
  toast('Diğer cihazdaki değişiklikler bu cihazdakilerle birleştirildi');
  return true;
}
function applyPanelJson(json, at, quietToast){
  try{
    const d = JSON.parse(json);
    if(!d || !Array.isArray(d.students)) return false;
    localStorage.setItem(KEY, json);
    state = load();
    _panelAt = at; localStorage.setItem(PANEL_AT_KEY, String(at));
    cloud.panelPushed = at; saveCloud();
    panelBaseSet(json, at);
    clearPanelDirty();
    _panelPending = null;
    render(); if(!quietToast) toast(`Panel verisi buluttan geldi · ${stateCount()} kayıt`);
    return true;
  }catch(e){ return false; }
}
/* Form kapandığında bekleyen bulut güncellemesi varsa birleştirerek uygula */
function flushPanelPending(){
  if(!_panelPending) return;
  const {json, at} = _panelPending;
  _panelPending = null;
  if(at === cloud.panelPushed) return;
  _panelQ = _panelQ.then(() => takeRemote(json, at)).catch(() => {});
}
/* Bağlantı geri gelince / uygulamaya dönünce bekleyen değişiklikleri gönder */
window.addEventListener('online', () => { if(panelDirty()) scheduleSync(true); });
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible' && panelDirty()) scheduleSync(true); });
function stopPanel(){ if(_panelUnsub){ _panelUnsub(); _panelUnsub = null; } _panelSeen = false; _panelPending = null; }
/* Bulut belgesi doluluk ölçeri */
const fmtKB = b => b >= 1048576 ? (b/1048576).toFixed(2)+' MB' : Math.max(1,Math.round(b/1024))+' KB';
function panelPct(){ return Math.min(100, Math.round(_panelBytes / PANEL_LIMIT * 100)); }
function panelSizeWarn(){
  const pct = panelPct();
  if(pct >= 75 && !_panelWarned){
    _panelWarned = true;
    toast(`Bulut belgesi %${pct} dolu — Bulut penceresinden kontrol et`);
  }
  if(pct < 70) _panelWarned = false;
}
function panelSizeHtml(){
  if(!fb.user || !_panelBytes) return '';
  const pct = panelPct();
  const col = pct >= 90 ? 'var(--red)' : pct >= 75 ? 'var(--amber)' : 'var(--green)';
  const ratio = _panelRaw && _panelBytes ? (_panelRaw/_panelBytes) : 1;
  const kalan = Math.max(0, PANEL_LIMIT - _panelBytes);
  const perRec = _panelRemoteCount ? (_panelBytes/_panelRemoteCount) : 0;
  const tahmin = perRec ? Math.floor(kalan/perRec) : null;
  let uyari = '';
  if(pct >= 90) uyari = `<div style="color:var(--red);font-weight:600;margin-top:6px">Sınıra çok yaklaştın. Yedek al ve eski kayıtları temizle.</div>`;
  else if(pct >= 75) uyari = `<div style="color:var(--amber);font-weight:600;margin-top:6px">Belge dolmak üzere. Eski yılların kayıtlarını temizlemeyi düşün.</div>`;
  return `
  <div style="margin-top:10px">
    <div style="display:flex;justify-content:space-between;font-size:.78rem;margin-bottom:5px">
      <span>Bulut belgesi doluluğu</span><span style="font-variant-numeric:tabular-nums;color:${col};font-weight:700">%${pct}</span>
    </div>
    <div style="height:8px;border-radius:5px;background:var(--line);overflow:hidden">
      <i style="display:block;height:100%;width:${Math.max(2,pct)}%;background:${col}"></i>
    </div>
    <div class="hint-text" style="margin-top:6px">
      ${fmtKB(_panelBytes)} / ${fmtKB(PANEL_LIMIT)} kullanıldı${ratio>1.2?` · ${ratio.toFixed(1)} kat sıkıştırıldı (ham ${fmtKB(_panelRaw)})`:' · sıkıştırma kapalı'}
      ${tahmin!=null?`<br>Bu hızla yaklaşık <b>${tahmin.toLocaleString('tr-TR')}</b> kayıt daha sığar.`:''}
    </div>${uyari}
  </div>`;
}
/* Elle: buluttaki paneli bu cihaza indir */
async function pullPanelNow(){
  if(!fb.user || !fb.db){ toast('Önce Bulut penceresinden giriş yap'); return; }
  try{
    const doc = await panelRef().get();
    const r = doc.exists ? doc.data() : null;
    if(!r || (!r.data && !r.gz)){ toast('Bulutta panel verisi yok — diğer cihazdan "Paneli Buluta Gönder" de'); return; }
    const json = await panelJson(r);
    const d = JSON.parse(json);
    if(!d || !Array.isArray(d.students)) throw 0;
    if(stateCount() && !confirm(`Bu cihazdaki ${stateCount()} kayıt, buluttaki ${stateCount(d)} kayıtla değiştirilecek. Devam edilsin mi?`)) return;
    localStorage.setItem(KEY, json);
    state = load();
    _panelAt = r.updatedAt || Date.now(); localStorage.setItem(PANEL_AT_KEY, String(_panelAt));
    cloud.panelPushed = _panelAt; saveCloud();
    await panelBaseSet(json, _panelAt); clearPanelDirty();
    closeModal(); go('dashboard'); toast(`Buluttan indirildi · ${stateCount()} kayıt`);
  }catch(e){ toast('İndirilemedi: ' + (e.message||'veri okunamadı')); }
}
/* Elle: bu cihazdaki paneli buluta gönder */
async function pushPanelNow(){
  if(!fb.user || !fb.db){ toast('Önce Bulut penceresinden giriş yap'); return; }
  if(!stateCount()){ toast('Bu cihazda kayıt yok — gönderilecek bir şey yok'); return; }
  if(_panelRemoteCount && !confirm(`Buluttaki ${_panelRemoteCount} kayıt, bu cihazdaki ${stateCount()} kayıtla değiştirilecek. Devam edilsin mi?`)) return;

    await pushPanel(true);
    toast(`Buluta gönderildi · ${stateCount()} kayıt`);
    const st = document.getElementById('cloudStatus'); if(st) st.innerHTML = cloudStatusText();
  }catch(e){ toast('Gönderilemedi: ' + (e.message||'')); }
}

async function watchTicks(){
  if(!fb.user || !fb.db) return;
  for(const s of state.students){
    if(_tickUnsubs[s.id]) continue;
    _tickUnsubs[s.id] = () => {}; // aynı anda iki kez abone olmayı önle
    const tid = await tickId(s);
    _tickUnsubs[s.id] = fb.db.collection('ticks').doc(tid).onSnapshot(
      snap => applyTicks(s.id, snap.exists ? snap.data() : null),
      err => { /* izin hatası vb. — sessiz geç */ });
  }
  for(const id of Object.keys(_tickUnsubs)){
    if(!state.students.some(s=>s.id===id)){ _tickUnsubs[id](); delete _tickUnsubs[id]; }
  }
}
function stopTicks(){ for(const id of Object.keys(_tickUnsubs)){ _tickUnsubs[id](); delete _tickUnsubs[id]; } }
function applyTicks(sid, data){
  if(!data) return;
  let changed = 0, msg = '';
  const s = student(sid); const first = s ? s.name.split(' ')[0] : 'Öğrenci';
  // 0) Son giriş: öğrenci sayfası açılınca seenAt yazar (eski kurallarda yalnızca updatedAt güncellenir)
  const seen = +data.seenAt || +data.updatedAt || 0;
  if(s && seen > (+s.lastSeen||0)){ s.lastSeen = seen; changed++; }
  // 1) Ödev tikleri
  for(const [hwId, t] of Object.entries(data.hw||{})){
    const h = state.homeworks.find(x=>x.id===hwId && x.sid===sid);
    if(!h || !t || !t.status) continue;
    if((+t.at||0) > (+h.updatedAt||0) && h.status !== t.status){
      h.status = t.status; h.updatedAt = +t.at; h.byStudent = true; changed++;
      msg = `${first} ödev durumunu güncelledi: ${h.desc}`;
    }
  }
  // 2) Öğrencinin girdiği denemeler (kaynak: öğrenci; öğretmen düzenlerse öğretmen kazanır)
  const ex = data.exams || {};
  for(const [srcId, e] of Object.entries(ex)){
    if(!e || !e.date) continue;
    const clean = sanitizeStudentExam(e); if(!clean) continue;
    let cur = state.exams.find(x=>x.srcId===srcId && x.sid===sid);
    if(!cur){ state.exams.push({id:uid(), sid, srcId, byStudent:true, updatedAt:+e.at||0, ...clean}); changed++; msg = `${first} deneme sonucu girdi: ${clean.name || clean.type}`; }
    else if((+e.at||0) > (+cur.updatedAt||0)){ Object.assign(cur, clean, {updatedAt:+e.at, byStudent:true}); changed++; msg = `${first} bir deneme sonucunu düzenledi`; }
  }
  const before = state.exams.length;
  state.exams = state.exams.filter(x=>!(x.sid===sid && x.srcId && !ex[x.srcId]));
  if(state.exams.length !== before) changed++;
  // 3) Çalışma kayıtları
  const st = data.studies || {};
  state.studies = state.studies || [];
  for(const [id, x] of Object.entries(st)){
    if(!x || !x.date || !x.subject) continue;
    const clean = {date:String(x.date).slice(0,10), subject:String(x.subject).slice(0,40), hours:Math.max(0, Math.min(24, +x.hours||0)), topic:String(x.topic||'').slice(0,600), at:+x.at||0};
    let cur = state.studies.find(y=>y.id===id);
    if(!cur){ state.studies.push({id, sid, ...clean}); changed++; msg = `${first} çalışma kaydı ekledi: ${clean.subject}`; }
    else if(clean.at > (+cur.at||0)){ Object.assign(cur, clean); changed++; }
  }
  const b2 = state.studies.length;
  state.studies = state.studies.filter(y=>!(y.sid===sid && !st[y.id]));
  if(state.studies.length !== b2) changed++;

  // 4) Haftalık program blokları (öğrenci ekler/düzenler/siler; en son değiştiren kazanır)
  state.plans = state.plans || [];
  for(const [key, x] of Object.entries(data.plan || {})){
    if(!x) continue;
    const at = +x.at || 0;
    const cur = state.plans.find(p=>p.sid===sid && planKey(p)===key);
    if(x.deleted){
      if(cur && at > (+cur.updatedAt||0)){ state.plans = state.plans.filter(p=>p!==cur); changed++; msg = `${first} programından bir çalışmayı kaldırdı`; }
      if(at < Date.now() - 7*86400000) removeStudentInput(sid, 'plan', key);   // eski silme işaretlerini temizle
      continue;
    }
    const clean = sanitizePlan(x); if(!clean) continue;
    if(!cur){ state.plans.push({id:uid(), sid, srcId:key, byStudent:true, updatedAt:at, ...clean}); changed++; msg = `${first} programına çalışma ekledi: ${clean.subject}`; }
    else if(at > (+cur.updatedAt||0)){ Object.assign(cur, clean, {updatedAt:at, byStudent:true}); changed++; msg = `${first} programını güncelledi: ${clean.subject}`; }
  }

  if(changed){ save(); render(); if(msg) toast(msg); }
}
function sanitizeStudentExam(e){
  const num = v => { const n = parseFloat(v); return isNaN(n) ? null : Math.round(n*100)/100; };
  const base = {date:String(e.date).slice(0,10), name:String(e.name||'').slice(0,80), note:String(e.note||'').slice(0,300)};
  if(e.kind==='brans'){
    const net = num(e.net); if(net==null || net<0 || net>BRANS_MAX) return null;
    return {...base, kind:'brans', type:'Branş', bransSubject:String(e.bransSubject||'Matematik').slice(0,20), net, sure:num(e.sure), nets:null};
  }
  const type = GENEL_NETS[e.type] ? e.type : 'TYT';
  const nets = {}; let tot = 0, any = false;
  for(const [sub, max] of GENEL_NETS[type]){
    const v = e.nets && num(e.nets[sub]); if(v==null) continue;
    if(v<0 || v>max) return null;
    nets[sub] = v; tot += v; any = true;
  }
  if(!any) return null;
  return {...base, kind:'genel', type, nets, net:Math.round(tot*100)/100, sure:null, bransSubject:null};
}
/* Öğretmen bir öğrenci girdisini silince öğrencinin bulut belgesinden de kaldır */
async function removeStudentInput(sid, field, id){
  try{
    const s = student(sid); if(!s || !fb.db) return;
    const tid = await tickId(s);
    await fb.db.collection('ticks').doc(tid).update({[`${field}.${id}`]: firebase.firestore.FieldValue.delete(), updatedAt: Date.now()});
  }catch(e){}
}

/* --- Firestore güvenlik kuralları (e-posta doldurulmuş) --- */
function rulesText(email){
  return `rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    function isTeacher() {
      return request.auth != null && request.auth.token.email == "${email}";
    }
    // Şifreli öğrenci sayfaları: adresi bilen okur, yalnızca öğretmen yazar
    match /pages/{sid} {
      allow get: if true;
      allow list: if false;
      allow write: if isTeacher();
    }
    // Öğrenci tikleri: gizli adresi (kodu) bilen okur/yazar
    match /ticks/{tid} {
      allow get: if true;
      allow list: if false;
      allow create, update: if request.resource.data.keys().hasOnly(['hw', 'exams', 'studies', 'plan', 'seenAt', 'updatedAt'])
        && (!('seenAt' in request.resource.data) || request.resource.data.seenAt is number)
        && (!('hw' in request.resource.data) || (request.resource.data.hw is map && request.resource.data.hw.size() <= 500))
        && (!('exams' in request.resource.data) || (request.resource.data.exams is map && request.resource.data.exams.size() <= 300))
        && (!('studies' in request.resource.data) || (request.resource.data.studies is map && request.resource.data.studies.size() <= 2000))
        && (!('plan' in request.resource.data) || (request.resource.data.plan is map && request.resource.data.plan.size() <= 400));
      allow delete: if isTeacher();
    }
    // Panel verisi (öğrenciler, dersler, ücretler, kişisel notlar): yalnızca öğretmen hesabı, kendi belgesi
    match /panel/{uid} {
      allow read, write: if isTeacher() && request.auth.uid == uid;
    }
    match /{document=**} {
      allow read, write: if false;
    }
  }
}`;
}

function cloudStatusText(){
  const n = Object.keys(cloud.synced).length;
  let s = fb.user ? `Giriş: <b>${esc(fb.user.email)}</b><br>` : 'Giriş yapılmadı. E-posta ve şifreyle bağlan.<br>';
  if(cloud.lastSync) s += `Son senkron: ${new Date(cloud.lastSync).toLocaleString('tr-TR')} · ${n} öğrenci bulutta<br>`;
  if(fb.user) s += `Panel: bu cihazda <b>${stateCount()}</b> kayıt · bulutta <b>${_panelSeen ? _panelRemoteCount : '?'}</b> kayıt${_panelRemoteAt>1?' ('+new Date(_panelRemoteAt).toLocaleString('tr-TR')+')':''}<br>`;
  s += panelSizeHtml();
  if(fb.error) s += `<span style="color:var(--red)">${esc(fb.error)}</span>`;
  return s;
}
function parseConfigBlock(txt){
  const out = {}; const re = /(apiKey|authDomain|projectId|storageBucket|messagingSenderId|appId)\s*[:=]\s*["']([^"']+)["']/g;
  let m; while((m = re.exec(txt))) out[m[1]] = m[2];
  return (out.apiKey && out.projectId && out.appId) ? out : null;
}
async function saveCloudForm(){
  const cfgTxt = fv('c_cfg');
  if(cfgTxt){
    const c = parseConfigBlock(cfgTxt);
    if(!c){ toast('Ayar bloğu okunamadı: apiKey, projectId ve appId olmalı'); return; }
    if(c.projectId !== cloudConfig().projectId){ cloud.config = c; cloud.synced = {}; saveCloud(); toast('Yeni proje kaydedildi — sayfayı yenile'); return; }
    cloud.config = c;
  }
  cloud.site = fv('c_site'); saveCloud();
  if(fb.user){ closeModal(); toast('Kaydedildi'); return; }
  const email = fv('c_email'), pass = fv('c_pass');
  if(!email || !pass){ toast('E-posta ve şifre gerekli'); return; }
  cloud.email = email; saveCloud();
  const st = document.getElementById('cloudStatus'); if(st) st.innerHTML = 'Bağlanılıyor…';
  try{
    await cloudSignIn(email, pass);
    closeModal(); toast('Buluta bağlanıldı — veriler gönderiliyor');
  }catch(e){
    fb.error = cloudErrText(e); fb.status = 'error'; updateCloudBadge();
    if(st) st.innerHTML = cloudStatusText();
  }
}
function copyRules(){
  const email = fv('c_email') || cloud.email || (fb.user && fb.user.email) || 'SENIN@EPOSTAN.com';
  copyText(rulesText(email));
}

function regenCode(id){
  const s = student(id); if(!s) return;
  if(!confirm('Yeni kod üretilsin mi? Eski kod artık çalışmaz; öğrenciye yeni kodu göndermelisin.')) return;
  // Eski tik belgesini bırak; yeni kodla yeni belge oluşur
  if(_tickUnsubs[id]){ _tickUnsubs[id](); delete _tickUnsubs[id]; }
  s.code = genCode(); save(); watchTicks(); openShareForm(id); toast('Yeni kod üretildi');
}
function copyText(t){
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(
    ()=>toast('Kopyalandı'),
    ()=>{ prompt('Kopyala:', t); });
}
